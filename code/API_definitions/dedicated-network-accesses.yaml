externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/DedicatedNetworks
servers:
  - url: "{apiRoot}/dedicated-network-accesses/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Access Groups
    description: Manage groups of accesses to a dedicated network for devices
  - name: Accesses
    description: Manage individual device accesses within an access group
paths:

  /access-groups:
    get:
      tags:
        - Access Groups
      summary: Get a paged list of access groups, optionally filtered for a given dedicated network
      description: |
        Get a paged list of access groups, optionally filtered for a given dedicated network
      operationId: listAccessGroups
      security:
        - openId:
            - dedicated-network-accesses:access-groups:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of access groups to return per page
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/PerPage"
        - name: page
          in: query
          description: |
            Number of the page of access groups to return
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Page"
        - name: networkId
          in: query
          description: Only access groups applying to this dedicated network are to be returned
          schema:
            $ref: '#/components/schemas/NetworkId'
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: A list of existing access groups matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-pages'
            Link:
              $ref: '../common/CAMARA_common.yaml#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroupInfosPage'
              examples:
                LIST_ACCESS_GROUPS_EXAMPLE:
                  $ref: '#/components/examples/LIST_ACCESS_GROUPS_EXAMPLE'
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"
    post:
      tags:
        - Access Groups
      summary: Create an access group for a dedicated network, optionally admitting devices immediately
      description: |
        Create an access group for a dedicated network, optionally admitting devices immediately
      operationId: createAccessGroup
      security:
        - openId:
            - dedicated-network-accesses:access-groups:create
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessGroupRequest'
      callbacks:
        notifications:
          $ref: "#/components/callbacks/notifications"
      responses:
        '201':
          description: Successful creation of the access group; no devices were supplied
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: 'URL including the resource identifier of the newly created access group.'
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroupInfo'
              examples:
                CREATE_ACCESS_GROUP_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/CREATE_ACCESS_GROUP_SUCCESS_EXAMPLE'
        '207':
          description: |
            Successful creation of the access group; devices were supplied, with a per-device outcome for each. `results` carries exactly one entry per requested device, in request order. `summary.succeeded` is the number of devices admitted.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: 'URL including the resource identifier of the newly created access group.'
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessGroupPartialSuccess'
              examples:
                CREATE_ACCESS_GROUP_PARTIAL_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/CREATE_ACCESS_GROUP_PARTIAL_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "409":
          $ref: "#/components/responses/IncompatibleState409"
        "422":
          $ref: "#/components/responses/NoValidDevice422"

  /access-groups/{accessGroupId}:
    parameters:
      - name: accessGroupId
        description: access group identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessGroupId"
      - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
    get:
      tags:
        - Access Groups
      summary: Read access group information
      description: |
        Read access group information
      operationId: getAccessGroup
      security:
        - openId:
            - dedicated-network-accesses:access-groups:read
      responses:
        '200':
          description: Access group information
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGroupInfo'
              examples:
                CREATE_ACCESS_GROUP_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/CREATE_ACCESS_GROUP_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"

    delete:
      tags:
        - Access Groups
      summary: Delete an access group
      description: |
        Delete an access group. Every access in the group is deleted as well; no notification is sent for this deletion.
      operationId: deleteAccessGroup
      security:
        - openId:
            - dedicated-network-accesses:access-groups:delete
      responses:
        '204':
          description: Successful deletion of the access group and every access in it
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"

  /accesses:
    get:
      tags:
        - Accesses
      summary: Get a paged list of accesses, optionally filtered by access group, network and/or status
      description: |
        Get a paged list of accesses, optionally filtered by access group, network and/or status
      operationId: listAccesses
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of accesses to return per page
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/PerPage"
        - name: page
          in: query
          description: |
            Number of the page of accesses to return
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Page"
        - name: accessGroupId
          in: query
          description: Only accesses belonging to this access group are to be returned
          schema:
            $ref: '#/components/schemas/AccessGroupId'
        - name: networkId
          in: query
          description: Only accesses to this dedicated network are to be returned
          schema:
            $ref: '#/components/schemas/NetworkId'
        - name: status
          in: query
          description: Only accesses with this status are to be returned
          schema:
            $ref: "#/components/schemas/AccessStatus"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: A list of existing accesses matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-pages'
            Link:
              $ref: '../common/CAMARA_common.yaml#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfosPage'
              examples:
                LIST_ACCESSES_EXAMPLE:
                  $ref: '#/components/examples/LIST_ACCESSES_EXAMPLE'
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"
    post:
      tags:
        - Accesses
      summary: Create an access to admit a device to an access group
      description: |
        Create an access to admit a device to an access group
      operationId: createAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:create
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      responses:
        '201':
          description: Successful creation of the access
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: 'URL including the resource identifier of the newly created access.'
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfo'
              examples:
                CREATE_ACCESS_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/CREATE_ACCESS_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"
        "409":
          $ref: "#/components/responses/AccessConflict409"
        "422":
          $ref: "#/components/responses/LocalDeviceIdentifier422WithCapacity"

  /accesses/{accessId}:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessId"
      - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
    get:
      tags:
        - Accesses
      summary: Read access information
      description: |
        Read access information
      operationId: getAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      responses:
        '200':
          description: Access information
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfo'
              examples:
                CREATE_ACCESS_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/CREATE_ACCESS_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"

    delete:
      tags:
        - Accesses
      summary: Delete an access
      description: |
        Delete an access
      operationId: deleteAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:delete
      responses:
        '204':
          description: Successful deletion of the access
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"

  /batch-create-accesses:
    post:
      tags:
        - Accesses
      summary: Create accesses to admit multiple devices to an access group
      description: |
        Create accesses to admit multiple devices to an access group in one request. Each device becomes its own, individually addressable access.

        This operation requires a two-legged access token and an explicit `devices` list; it does not support device identification from the access token.
      operationId: createAccesses
      security:
        - openId:
            - dedicated-network-accesses:accesses:create
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessesRequest'
      responses:
        '207':
          description: |
            The batch was processed; the response carries a per-device outcome for every requested device, whatever the mix of successes and failures. `results` carries exactly one entry per requested device, in request order. `summary.succeeded` is the number of devices admitted.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessesResults'
              examples:
                BATCH_CREATE_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/BATCH_CREATE_SUCCESS_EXAMPLE'
                BATCH_CREATE_PARTIAL_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/BATCH_CREATE_PARTIAL_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"
        "409":
          $ref: "#/components/responses/AccessConflict409"
        "422":
          $ref: "#/components/responses/NoValidDevice422"

  /batch-delete-accesses:
    post:
      tags:
        - Accesses
      summary: Delete multiple accesses
      description: |
        Delete multiple accesses in one request. The accesses do not need to belong to the same access group.

        This operation requires a two-legged access token and an explicit `accessIds` list; it does not support device identification from the access token.
      operationId: deleteAccesses
      security:
        - openId:
            - dedicated-network-accesses:accesses:delete
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessesRequest'
      responses:
        '207':
          description: |
            The batch was processed; the response carries a per-access outcome for every requested accessId, whatever the mix of successes and failures. `results` carries exactly one entry per requested accessId, in request order. `summary.succeeded` is the number of accesses deleted.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccessesResults'
              examples:
                BATCH_DELETE_PARTIAL_SUCCESS_EXAMPLE:
                  $ref: '#/components/examples/BATCH_DELETE_PARTIAL_SUCCESS_EXAMPLE'
        '400':
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "422":
          $ref: "#/components/responses/NoValidAccess422"

  /retrieve-accesses:
    post:
      tags:
        - Accesses
      summary: Retrieve accesses for a device
      description: |
        Retrieve the accesses for a device, optionally filtered by network and/or access group.

        **NOTES:**
        - The access token may be either 2-legged or 3-legged.
          - If a 3-legged access token is used, the subject associated with the access(es) must also be associated with the access token. In this case the optional `device` parameter MUST NOT be provided in the request.
          - If a 2-legged access token is used, the `device` parameter must be provided and identify a device.
        - If no access is found for the requested device, an empty array is returned.
        - This call uses the `POST` method instead of `GET` because the `device` field may contain personal data, which should not be sent via `GET`.
      operationId: retrieveAccessesByDevice
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveAccessesRequest'
      responses:
        '200':
          description: Returns the accesses for a given device. A device may have multiple accesses, thus the response is an array. An empty array is returned if no access is found.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAccessesResponse'
              examples:
                RETRIEVE_ACCESSES_EXAMPLE:
                  $ref: '#/components/examples/RETRIEVE_ACCESSES_EXAMPLE'
                RETRIEVE_ACCESSES_EMPTY_EXAMPLE:
                  $ref: '#/components/examples/RETRIEVE_ACCESSES_EMPTY_EXAMPLE'
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/LocalNotFound404"
        "422":
          $ref: "#/components/responses/LocalDeviceIdentifier422"

components:
  securitySchemes:
    openId:
      description: OpenID Connect authentication
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    notificationsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "{$request.body#/sinkCredential.credentialType}"
      description: |
        Bearer token for notification delivery. Token format is determined
        by `sinkCredential.credentialType` in the subscription request.

  callbacks:
    notifications:
      "{$request.body#/sink}":
        post:
          tags:
            - Access group status callback
          summary: "Access status change notifications callback"
          description: |
            Important: this endpoint is to be implemented by the API consumer.
            It will be called upon a change of the admission status of one or more accesses in the access group, or of the access group as a whole.
            Currently ACCESS_STATUS_CHANGED and ACCESS_GROUP_STATUS_CHANGED events are defined.
          operationId: postNotification
          parameters:
            - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
          requestBody:
            required: true
            content:
              application/cloudevents+json:
                schema:
                  $ref: "#/components/schemas/AccessGroupNotificationEvent"
                examples:
                  ACCESS_STATUS_CHANGED_EXAMPLE:
                    $ref: "#/components/examples/ACCESS_STATUS_CHANGED_EXAMPLE"
                  ACCESS_GROUP_STATUS_CHANGED_EXAMPLE:
                    $ref: "#/components/examples/ACCESS_GROUP_STATUS_CHANGED_EXAMPLE"
          responses:
            "204":
              description: Successful notification
              headers:
                x-correlator:
                  $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            "400":
              $ref: "#/components/responses/Generic400"
            "401":
              $ref: "#/components/responses/Generic401"
            "403":
              $ref: "#/components/responses/Generic403"
            "410":
              $ref: "#/components/responses/Generic410"
          security:
            - {}
            - notificationsBearerAuth: []

  schemas:
    AccessGroupId:
      description: Access group id in UUID format
      type: string
      format: uuid
      maxLength: 36

    AccessId:
      description: Access id in UUID format
      type: string
      format: uuid
      maxLength: 36

    NetworkId:
      description: Network id in UUID format
      type: string
      format: uuid
      maxLength: 36

    AccessStatus:
      description: |
        The current admission status of an access. The status can be one of the following:
        * `REQUESTED` - The access was requested. Possible transitions to GRANTED and DENIED states.
        * `GRANTED` - The access was granted by the CSP, and therefore the device can use the Dedicated Network when the network is in the ACTIVATED state. Possible transition to DENIED state.
        * `DENIED` - The access was denied by the CSP, and therefore the device can not use the Dedicated Network. The denial can be caused by a variety of conditions, such as lack of resources, system failure, or the network being terminated.

      type: string
      enum:
        - REQUESTED
        - GRANTED
        - DENIED

    AccessStatusInfo:
      description: Additional information about the reason for the current access status
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the reason
          enum:
            - REQUEST_APPROVED
            - REQUEST_REJECTED
            - REQUEST_FAILED
            - ACCESS_REVOKED
            - ACCESS_FAILED
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the reason represents

    QosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an operator is offering can be retrieved by means of the QoS Profile API.
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: "^[a-zA-Z0-9_.-]+$"

    Devices:
      description: A list of devices
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    BaseAccessGroupInfo:
      description: Common attributes of an access group
      type: object
      properties:
        networkId:
          $ref: "#/components/schemas/NetworkId"
        name:
          description: A human-readable name to describe the access group
          type: string
          minLength: 1
          maxLength: 1024
        qosProfiles:
          description: (Optional) List of supported QOS profiles usable for the devices in this access group. When absent, all QosProfiles of the network are supported. Only a subset of the QOS profiles of the network is allowed
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/QosProfileName"
        defaultQosProfile:
          $ref: "#/components/schemas/QosProfileName"
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          type: string
          format: uri
          pattern: ^https:\/\/.+$
          maxLength: 2048
        sinkCredential:
          $ref: '../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential'
      required:
        - networkId

    CreateAccessGroupRequest:
      description: Attributes required to create an access group, optionally admitting devices immediately
      allOf:
        - $ref: "#/components/schemas/BaseAccessGroupInfo"
        - type: object
          properties:
            devices:
              $ref: "#/components/schemas/Devices"

    AccessGroupInfo:
      description: |
        Information about an access group, which includes the following:
        * `id` - a unique identifier of the access group
        * `networkId` - the dedicated network this group applies to
        * `name` - optionally, a human-readable name for the group
        * `qosProfiles` / `defaultQosProfile` - the QoS policy for the group's devices
        * `sink` / `sinkCredential` - optionally, callback information for event notifications pertaining to the group's accesses
      allOf:
        - $ref: "#/components/schemas/BaseAccessGroupInfo"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/AccessGroupId"
          required:
            - id

    AccessGroupInfosPage:
      description: A page of access groups with information
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: A list of access groups with information
          items:
            $ref: "#/components/schemas/AccessGroupInfo"
          maxItems: 100
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    CreateAccessRequest:
      description: Attributes required to create an access admitting a device to an access group
      type: object
      required:
        - accessGroupId
      properties:
        accessGroupId:
          $ref: "#/components/schemas/AccessGroupId"
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    AccessInfo:
      description: |
        Information about an access, which includes the following:
        * `id` - a unique identifier of the access
        * `accessGroupId` - the access group this access belongs to
        * `networkId` - the dedicated network the access group applies to, echoed here read-only for convenience
        * `device` - the device identifier the API consumer supplied, echoed back
        * `status` - the current admission status of the access
        * `effectiveQosProfile` - the QoS profile actually in force for the device on this access, once known
      allOf:
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/AccessId"
            accessGroupId:
              $ref: "#/components/schemas/AccessGroupId"
            networkId:
              $ref: "#/components/schemas/NetworkId"
            device:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"
            status:
              $ref: "#/components/schemas/AccessStatus"
            statusInfo:
              $ref: "#/components/schemas/AccessStatusInfo"
            effectiveQosProfile:
              description: |
                The QoS profile actually in force for the device on this access. Absent while the access is not `GRANTED`.
                When a device holds accesses in more than one access group on the same network and their `defaultQosProfile` values differ, this field reports the profile the provider actually resolved to, making that resolution observable.
              allOf:
                - $ref: "#/components/schemas/QosProfileName"
          required:
            - id
            - accessGroupId
            - networkId
            - device
            - status

    AccessInfosPage:
      description: A page of accesses with information
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: A list of accesses with information
          items:
            $ref: "#/components/schemas/AccessInfo"
          maxItems: 100
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    CreateAccessesRequest:
      description: Attributes required to create accesses admitting multiple devices to an access group
      type: object
      required:
        - accessGroupId
        - devices
      properties:
        accessGroupId:
          $ref: "#/components/schemas/AccessGroupId"
        devices:
          $ref: "#/components/schemas/Devices"

    BatchSummary:
      description: |
        Counts for the outcome of a batch operation. `requested` equals the number of
        entries in `results`, so `succeeded == requested` means every requested item
        was processed successfully.
      type: object
      required:
        - requested
        - succeeded
        - failed
      properties:
        requested:
          description: The number of items in the request, equal to the number of entries in `results`
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        succeeded:
          description: The number of requested items processed successfully
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        failed:
          description: The number of requested items that could not be processed
          type: integer
          format: int32
          minimum: 0
          maximum: 100

    CreateAccessesResult:
      description: |
        Outcome for one device in a batch admit request (whether via `POST /access-groups` or
        `POST /batch-create-accesses`). `device` identifies the requested device and is always
        present. `access` is present when the device was admitted, carrying the complete created
        access resource (DD3); `code` and `message` are present instead when it was not.
      type: object
      required:
        - device
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"
        access:
          $ref: "#/components/schemas/AccessInfo"
        code:
          type: string
          maxLength: 96
          description: A code to describe why this device could not be admitted. Absent when the device was admitted successfully
          enum:
            - ALREADY_EXISTS
            - SERVICE_NOT_APPLICABLE
            - UNSUPPORTED_IDENTIFIER
            - DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the failure represents. Absent when the device was admitted successfully

    CreateAccessesResults:
      description: |
        Response body for a batch admit request (`POST /batch-create-accesses`), or the
        per-device portion of `POST /access-groups`'s `207` response.
      type: object
      required:
        - results
        - summary
      properties:
        results:
          description: |
            One entry per requested device, in the same order as the request.
          type: array
          items:
            $ref: '#/components/schemas/CreateAccessesResult'
          minItems: 1
          maxItems: 100
        summary:
          $ref: '#/components/schemas/BatchSummary'

    CreateAccessGroupPartialSuccess:
      description: |
        Response body used when an access group was created with devices supplied. The group is
        returned together with the per-device outcomes; the group is always created regardless of
        how many devices were admitted.
      allOf:
        - $ref: '#/components/schemas/AccessGroupInfo'
        - $ref: '#/components/schemas/CreateAccessesResults'

    CreateAccessFailure:
      description: |
        Failure outcome for one device in a request where none of the devices were admitted.
        Unlike `CreateAccessesResult`, every entry here is necessarily a failure, so `code` and
        `message` are required and there is no `access` property to be mistaken for one.
      type: object
      required:
        - device
        - code
        - message
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"
        code:
          type: string
          maxLength: 96
          description: A code to describe why this device could not be admitted
          enum:
            - ALREADY_EXISTS
            - SERVICE_NOT_APPLICABLE
            - UNSUPPORTED_IDENTIFIER
            - DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the failure represents

    DeleteAccessesRequest:
      description: Attributes required to delete multiple accesses in one request
      type: object
      required:
        - accessIds
      properties:
        accessIds:
          description: The identifiers of the accesses to delete
          type: array
          items:
            $ref: "#/components/schemas/AccessId"
          minItems: 1
          maxItems: 100

    BatchDeleteAccessResult:
      description: |
        Outcome for one access in a batch delete request. Absence of `code` and `message` means the access
        was deleted successfully; their presence means it was not, carrying a domain-specific `code` rather
        than a nested HTTP status.
      type: object
      required:
        - accessId
      properties:
        accessId:
          $ref: '#/components/schemas/AccessId'
        code:
          type: string
          maxLength: 96
          description: A code to describe why this access could not be deleted. Absent when the access was deleted successfully
          enum:
            - NOT_FOUND
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the failure represents. Absent when the access was deleted successfully

    BatchDeleteAccessFailure:
      description: |
        Failure outcome for one access in a batch delete request where none of the accesses were
        deleted. Unlike `BatchDeleteAccessResult`, every entry here is necessarily a failure, so
        `code` and `message` are required.
      type: object
      required:
        - accessId
        - code
        - message
      properties:
        accessId:
          $ref: '#/components/schemas/AccessId'
        code:
          type: string
          maxLength: 96
          description: A code to describe why this access could not be deleted
          enum:
            - NOT_FOUND
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the failure represents

    DeleteAccessesResults:
      description: Response body for a batch delete request. One entry per requested `accessId`, in the same order as the request.
      type: object
      required:
        - results
        - summary
      properties:
        results:
          description: A list of per-access delete outcomes, one per requested accessId
          type: array
          items:
            $ref: '#/components/schemas/BatchDeleteAccessResult'
          minItems: 1
          maxItems: 100
        summary:
          $ref: '#/components/schemas/BatchSummary'

    RetrieveAccessesRequest:
      description: Parameters to retrieve accesses by device
      type: object
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        networkId:
          $ref: "#/components/schemas/NetworkId"
        accessGroupId:
          $ref: "#/components/schemas/AccessGroupId"

    RetrieveAccessesResponse:
      description: Accesses for a given device
      type: array
      items:
        $ref: "#/components/schemas/AccessInfo"
      minItems: 0
      maxItems: 100

    AccessGroupEventType:
      description: Enum of event types for the Dedicated Network Accesses API.
      type: string
      enum:
        - org.camaraproject.dedicated-network-accesses.v0.access-status-changed
        - org.camaraproject.dedicated-network-accesses.v0.access-group-status-changed

    AccessGroupNotificationEvent:
      description: Notification event for access and access group status changes. Constrains the CloudEvent `type` to access-specific event types.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/AccessGroupEventType"
      discriminator:
        propertyName: 'type'
        mapping:
          org.camaraproject.dedicated-network-accesses.v0.access-status-changed: "#/components/schemas/EventAccessStatusChanged"
          org.camaraproject.dedicated-network-accesses.v0.access-group-status-changed: "#/components/schemas/EventAccessGroupStatusChanged"

    EventAccessStatusChanged:
      description: Event to notify a status change of one or more, but not necessarily all, accesses within an access group
      allOf:
        - $ref: "#/components/schemas/AccessGroupNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Status change details for one or more accesses within an access group
              required:
                - accessGroupId
                - statusChanges
              properties:
                accessGroupId:
                  $ref: "#/components/schemas/AccessGroupId"
                statusChanges:
                  type: array
                  items:
                    $ref: "#/components/schemas/AccessStatusChange"
                  minItems: 1
                  maxItems: 100
          required:
            - data

    EventAccessGroupStatusChanged:
      description: Event to notify a uniform status change applying to every access in an access group at once
      allOf:
        - $ref: "#/components/schemas/AccessGroupNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Status change details applying to every access in the group
              required:
                - accessGroupId
                - status
              properties:
                accessGroupId:
                  $ref: "#/components/schemas/AccessGroupId"
                status:
                  $ref: "#/components/schemas/AccessStatus"
                statusInfo:
                  $ref: "#/components/schemas/AccessStatusInfo"
          required:
            - data

    AccessStatusChange:
      description: The status change of a single access. Identifies the access and its new status only - the resource itself is the source of truth for anything else.
      type: object
      required:
        - accessId
        - status
      properties:
        accessId:
          $ref: "#/components/schemas/AccessId"
        status:
          $ref: "#/components/schemas/AccessStatus"
        statusInfo:
          $ref: "#/components/schemas/AccessStatusInfo"

  responses:
    Generic400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
            GENERIC_400_OUT_OF_RANGE:
              description: Out of Range. Specific Syntax Exception used when a given field has a pre-defined range or a invalid filter criteria combination is requested
              value:
                status: 400
                code: OUT_OF_RANGE
                message: Client specified an invalid range.

    Generic401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              description: Request cannot be authenticated and a new authentication is required
              value:
                status: 401
                code: UNAUTHENTICATED
                message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication is required.

    Generic403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - INVALID_TOKEN_CONTEXT
          examples:
            GENERIC_403_PERMISSION_DENIED:
              description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
              value:
                status: 403
                code: PERMISSION_DENIED
                message: Client does not have sufficient permissions to perform this action.
            GENERIC_403_INVALID_TOKEN_CONTEXT:
              description: Reflect some inconsistency between information in some field of the API and the related OAuth2 Token
              value:
                status: 403
                code: INVALID_TOKEN_CONTEXT
                message: "{{field}} is not consistent with access token."

    # Not verbatim Commonalities Generic404 (r4.3's also carries IDENTIFIER_NOT_FOUND, unneeded
    # since A1/A2 drop identifier correlation) - shaped to match the upcoming Commonalities catalog
    # response NotFound404 so it can become a $ref once that lands.
    LocalNotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              description: Resource is not found
              value:
                status: 404
                code: NOT_FOUND
                message: The specified resource is not found.

    # Not verbatim Commonalities Generic409 (r4.3's also carries ABORTED and the deprecated
    # CONFLICT) - no upcoming Commonalities catalog response covers both ALREADY_EXISTS and
    # INCOMPATIBLE_STATE together, so this stays local rather than matching a future name.
    AccessConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ALREADY_EXISTS
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_ALREADY_EXISTS:
              description: An access already exists for this device in this access group, matched on an exact identifier match
              value:
                status: 409
                code: ALREADY_EXISTS
                message: The resource that a client tried to create already exists.
            GENERIC_409_INCOMPATIBLE_STATE:
              description: The dedicated network the access group applies to is in an incompatible state for the requested operation
              value:
                status: 409
                code: INCOMPATIBLE_STATE
                message: A referenced resource is in an incompatible state.

    IncompatibleState409:
      description: Conflict
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_INCOMPATIBLE_STATE:
              description: The dedicated network referenced in the request is in an incompatible state for the requested operation
              value:
                status: 409
                code: INCOMPATIBLE_STATE
                message: A referenced resource is in an incompatible state.

    Generic410:
      description: Gone
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 410
                  code:
                    enum:
                      - GONE
          examples:
            GENERIC_410_GONE:
              description: Use in notifications flow to allow API Consumer to indicate that its callback is no longer available
              value:
                status: 410
                code: GONE
                message: Access to the target resource is no longer available.

    # r4.3 has no single response matching just these four codes - shaped to match the upcoming
    # Commonalities catalog response DeviceIdentifier422 exactly, so it can become a $ref once
    # that lands.
    LocalDeviceIdentifier422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              description: Service not applicable for the provided identifier
              value:
                status: 422
                code: SERVICE_NOT_APPLICABLE
                message: The service is not available for the provided identifier.
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device cannot be identified from the 3-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.
            GENERIC_422_UNSUPPORTED_IDENTIFIER:
              description: None of the provided identifiers is supported by the implementation
              value:
                status: 422
                code: UNSUPPORTED_IDENTIFIER
                message: The identifier provided is not supported.
            GENERIC_422_UNNECESSARY_IDENTIFIER:
              description: An explicit identifier is provided when a device has already been identified from the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: The device is already identified by the access token.

    # Not verbatim Commonalities Generic422 - adds the API-specific
    # DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED code to the four codes of the
    # upcoming Commonalities catalog response DeviceIdentifier422.
    LocalDeviceIdentifier422WithCapacity:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              description: Service not applicable for the provided identifier
              value:
                status: 422
                code: SERVICE_NOT_APPLICABLE
                message: The service is not available for the provided identifier.
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device cannot be identified from the 3-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.
            GENERIC_422_UNSUPPORTED_IDENTIFIER:
              description: None of the provided identifiers is supported by the implementation
              value:
                status: 422
                code: UNSUPPORTED_IDENTIFIER
                message: The identifier provided is not supported.
            GENERIC_422_UNNECESSARY_IDENTIFIER:
              description: An explicit identifier is provided when a device has already been identified from the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: The device is already identified by the access token.
            DEDICATED_NETWORK_ACCESSES_422_MAX_NUMBER_OF_DEVICES_REACHED:
              description: The dedicated network has already reached its maxNumberOfDevices limit
              value:
                status: 422
                code: DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED
                message: The dedicated network has reached its maximum number of devices.

    # DD13: 422 no longer means "no device was admitted" for an operation that also creates a
    # container resource - it is reserved for a request that could not be processed at all. Kept
    # here per the design document's operation inventory; the concrete trigger is provider-specific
    # (analogous to SERVICE_NOT_APPLICABLE elsewhere in this API), since a device that is evaluated
    # and rejected - however many times - is reported per-device in the 201/207 body instead.
    NoValidDevice422:
      description: Unprocessable Content, the request could not be processed at all
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                required:
                  - results
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreateAccessFailure"
                    minItems: 1
                    maxItems: 100
          examples:
            DEDICATED_NETWORK_ACCESSES_422_NO_VALID_DEVICE:
              description: The request is syntactically correct but could not be processed at all.
              value:
                status: 422
                code: DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE
                message: None of the devices in the request could be processed.
                results:
                  - device:
                      phoneNumber: "+49123456789"
                    code: SERVICE_NOT_APPLICABLE
                    message: The service is not available for the provided identifier.
                  - device:
                      phoneNumber: "+491234500001"
                    code: SERVICE_NOT_APPLICABLE
                    message: The service is not available for the provided identifier.

    # DD3-preserved: unlike creation, deletion creates no resource whose existence could be
    # misdescribed, so "none of the requested accesses could be deleted" (e.g. every accessId
    # not found) remains a legitimate 422, distinct from the 207 case where at least one access
    # in the batch was actually deleted.
    NoValidAccess422:
      description: Unprocessable Content, none of the requested accesses could be deleted
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                required:
                  - results
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - DEDICATED_NETWORK_ACCESSES.NO_VALID_ACCESS
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BatchDeleteAccessFailure"
                    minItems: 1
                    maxItems: 100
          examples:
            DEDICATED_NETWORK_ACCESSES_422_NO_VALID_ACCESS:
              description: The request is syntactically correct but none of the accesses given in the request could be deleted.
              value:
                status: 422
                code: DEDICATED_NETWORK_ACCESSES.NO_VALID_ACCESS
                message: None of the accesses in the request could be processed successfully.
                results:
                  - accessId: b69e5404-3871-448d-8f9f-11dc5d29a4c8
                    code: NOT_FOUND
                    message: The specified resource is not found.
                  - accessId: 15f2c4b0-6b1a-4b0a-9b0a-1c2d3e4f5061
                    code: NOT_FOUND
                    message: The specified resource is not found.

