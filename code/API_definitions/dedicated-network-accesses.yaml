  version: wip
  x-camara-commonalities: 0.9
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/DedicatedNetworks
servers:
  - url: "{apiRoot}/dedicated-network-accesses/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Accesses
    description: Manage accesses to a dedicated network for devices
  - name: Devices
    description: Manage devices of an access to a dedicated network
paths:

  /accesses:
    get:
      tags:
        - Accesses
      summary: Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or matching a certain name and/or for a given dedicated network
      description: |
        Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or matching a certain name and/or for a given dedicated network
      operationId: listAccesses
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of accesses to return per page
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/PerPage"
        - name: page
          in: query
          description: |
            Number of the page of accesses to return
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Page"
        - name: networkId
          in: query
          description: Dedicated network id
          schema:
            $ref: '#/components/schemas/NetworkId'
        - name: accessDeviceId
          in: query
          description: Access device id
          schema:
            $ref: '#/components/schemas/AccessDeviceId'
        - name: name
          in: query
          description: name of an access
          schema:
            type: string
            maxLength: 1024
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: A list of existing accesses to dedicated networks matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-pages'
            Link:
              $ref: '../common/CAMARA_common.yaml#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfosPage'
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"

    post:
      tags:
        - Accesses
      summary: Create an access to a dedicated network with given configuration, optionally including devices
      description: |
        This endpoint allows the API Consumer to create an Access to a dedicated network with the given configuration, and to optionally add one or more devices to that Access in the same operation.
        - If the access creation is successful and the request does not include device(s) to be added, the server will return a 201 response
        - If the access creation is not possible, the server will return a relevant 4xx response
        - If the access creation is possible and the request does include one or more devices to be added, the server response depends on the success or failure of adding devices to the access:
          - If the addition is successful for all the devices, the server will return a 201 response
          - If the addition is successful only for some of the devices, the server will return a 207 response with details of the failed devices
          - If no device can be added, the server will return a 422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE response
          - If a two-legged access token is used, the `devices` array containing at least one `device` object MUST be included in the request to trigger the addition of devices.
          - If a three-legged access token is used, the `devices` array MUST NOT be included since the request implies addition of a single device identified from the access token. If the `devices` array is included, a 422 UNNECESSARY_IDENTIFIER response is returned
          - When a device is successfully added to the access it becomes an access device resource with a device identifier and status initialised to a `REQUESTED` state. If the `device` object was used to identify the device, this object is also included in the access device, otherwise it is omitted. An asynchronous process of granting access for the device is then started
      operationId: createAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:create
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              tags:
                - Device access status callback
              summary: "Device access status notifications callback"
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                It will be called upon change of the network access request status.
                Currently only DEVICE_STATUS_CHANGED event is defined.
              operationId: postNotification
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/AccessDeviceNotificationEvent"
                    examples:
                      DEVICE_STATUS_CHANGED_EXAMPLE:
                        $ref: "#/components/examples/DEVICE_STATUS_CHANGED_EXAMPLE"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        '201':
          description: Successful creation of the access for all devices (if any)
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: 'URL including the resource identifier of the newly created network access.'
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessSuccess'
        '207':
          description: Successful creation of the access for some devices
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: 'URL including the resource identifier of the newly created network access.'
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessPartialSuccess'
        '400':
          $ref: "#/components/responses/CreateAccessBadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "#/components/responses/CreateAccessNotFound404"
        "409":
          $ref: "#/components/responses/CreateAccessConflict409"
        "422":
          $ref: "#/components/responses/NoProcessableDevices422"

  /accesses/{accessId}:
    get:
      tags:
        - Accesses
      summary: Read access information
      description: |
        Read access information
      operationId: readAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccessId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: Access information
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfo'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

    delete:
      tags:
        - Accesses
      summary: Delete an access
      description: |
        Delete an access
      operationId: deleteAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:delete
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AccessId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '204':
          description: Successful deletion of the access
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

  /accesses/{accessId}/devices:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessId"
    get:
      tags:
        - Devices
      summary: Read a paged list of devices with information included in the access, optionally filtered for a given device status and/or by given time constraints when a device was added to the access (can be empty)
      description: |
        Read a paged list of devices with information included in the access, optionally filtered for a given device status and/or by given time constraints when a device was added to the access (can be empty)
      operationId: listAccessDevices
      security:
        - openId:
            - dedicated-network-accesses:devices:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of access devices to return per page
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/PerPage"
        - name: page
          in: query
          description: |
            Number of the page of access devices to return
          schema:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Page"
        - name: deviceStatus
          in: query
          description: Only access devices with this status are to be returned
          schema:
            $ref: "#/components/schemas/DeviceStatus"
        - $ref: "#/components/parameters/AddedAtOrAfter"
        - $ref: "#/components/parameters/AddedAfter"
        - $ref: "#/components/parameters/AddedAtOrBefore"
        - $ref: "#/components/parameters/AddedBefore"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: A list of devices matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '../common/CAMARA_common.yaml#/components/headers/x-total-pages'
            Link:
              $ref: '../common/CAMARA_common.yaml#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevicesPage'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
  /accesses/{accessId}/devices/add:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessId"
      - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
    post:
      tags:
        - Devices
      summary: Add device(s) to the access
      description: |
        This endpoint allows the API Consumer to add one or more devices to an existing Access.
        - If the addition is successful for all the devices, the server will return a 201 response
        - If the addition is successful only for some of the devices, the server will return a 207 response with details of the failed devices
        - If no device can be added, the server will return a 422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE response
        - If a two-legged access token is used, the `devices` array containing at least one `device` object MUST be included in the request. If the `devices` array is not included, a 422 MISSING_IDENTIFIER response is returned
        - If a three-legged access token is used, the `devices` array MUST NOT be included since the request implies addition of a single device identified from the access token. If the `devices` array is included, a 422 UNNECESSARY_IDENTIFIER response is returned
        - When a device is successfully added to the access it becomes an access device resource with a device identifier and status initialised to a `REQUESTED` state. If the `device` object was used to identify the device, this object is also included in the access device, otherwise it is omitted. An asynchronous process of granting access for the device is then started
      operationId: addDevicesToAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDevicesRequest"
      responses:
        '201':
          description: Successful addition of all the given devices
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDevicesSuccess"
        '207':
          description: Partially successful addition of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDevicesPartialSuccess"
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
        "409":
          $ref: "#/components/responses/AccessDevicesConflict409"
        "422":
          $ref: "#/components/responses/NoProcessableDevices422"

  /accesses/{accessId}/devices/remove:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessId"
      - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
    post:
      tags:
        - Devices
      summary: Remove devices from the access
      description: Remove devices from the access
      operationId: removeDevicesFromAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:remove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveDevicesRequest"
      responses:
        '204':
          description: Successful removal of all the given devices
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        '207':
          description: Partially successful removal of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveDevicesPartialSuccess"
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
        "409":
          $ref: "#/components/responses/AccessDevicesConflict409"
        "422":
          $ref: "#/components/responses/NoProcessableDevices422"

  /accesses/{accessId}/devices/{accessDeviceId}:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessId"
      - name: accessDeviceId
        description: access device identifier
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AccessDeviceId"
    get:
      tags:
        - Devices
      summary: Read access device information
      description: |
        Read access device information
      operationId: readAccessDevice
      security:
        - openId:
            - dedicated-network-accesses:device:read
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '200':
          description: Access device information
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevice'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

    delete:
      tags:
        - Devices
      summary: Delete an access device
      description: |
        Delete an access device
      operationId: deleteAccessDevice
      security:
        - openId:
            - dedicated-network-accesses:device:delete
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        '204':
          description: Successful deletion of the access device
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

components:
  securitySchemes:
    openId:
      description: OpenID Connect authentication
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    notificationsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "{$request.body#/sinkCredential.credentialType}"
      description: |
        Bearer token for notification delivery. Token format is determined
        by `sinkCredential.credentialType` in the subscription request.

  parameters:
    AddedAtOrAfter:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access no earlier than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.gte
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedAfter:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access later than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.gt
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedAtOrBefore:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access no later than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.lte
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedBefore:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access earlier than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.lt
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64

  schemas:
    AccessId:
      description: Network access id in UUID format
      type: string
      format: uuid
      maxLength: 36

    NetworkId:
      description: Network id in UUID format
      type: string
      format: uuid
      maxLength: 36

    AccessDeviceId:
      description: |
        Network access device id in UUID format of a device included in one or more network accesses
        It is a unique identifier of the device included in the access and is the same across all the accesses in which the device is included
      type: string
      format: uuid
      maxLength: 36

    DeviceStatus:
      description: |
        The current status of the device in the context of the access. The status can be one of the following:
        * `REQUESTED` - The device was requested to have access to the network. Possible transitions to GRANTED and DENIED states.
        * `GRANTED` - The device was granted access to the network by the CSP, and therefore the device can use the Dedicated Network when the network is in the ACTIVATED state. Possible transition to DENIED state.
        * `DENIED` - The device was denied access to the network by the CSP, and therefore the device can not use the Dedicated Network. The denial can be caused by a variety of conditions, such as lack of resources or system failure.

      type: string
      enum:
        - REQUESTED
        - GRANTED
        - DENIED

    ReasonInfo:
      description: |
        Information about the reason for a change
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the reason
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the reason represents

    DeviceStatusInfo:
      description: Additional information about the reason for the current device status
      type: object
      properties:
        reason:
          description: |
            Information about the reason for a device status change in the context of the access
          allOf:
            - $ref: "#/components/schemas/ReasonInfo"
            - type: object
              properties:
                code:
                  enum:
                    - REQUEST_APPROVED
                    - REQUEST_REJECTED
                    - REQUEST_FAILED
                    - ACCESS_REVOKED
                    - ACCESS_FAILED

    AccessDevicesPage:
      description: A page of access devices
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          $ref: "#/components/schemas/AccessDevices"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    AccessDevices:
      description: A list of access devices
      type: array
      minItems: 0
      maxItems: 9007199254740991
      items:
        $ref: "#/components/schemas/AccessDevice"

    AddedAccessDevices:
      description: |
        Information about devices requested and accepted to be added to the access in the most recent `createAccess` or `addDevicesToAccess` operation.
        These are the devices that were accepted for further processing, i.e. not immediately rejected due to an error condition and not removed by a more recent remove operation.
      type: object
      properties:
        addedAccessDevices:
          description: |
            A list of devices requested to be added to the access within either the `createAccess` operation or with the latest `addDevicesToAccess` operation, accepted for further processing, i.e. not immediately rejected due to an error condition and not removed by a more recent remove operation.
            **NOTE:** the list is limited to a maximum of 100 devices and may therefore not be a complete list of access devices within an access.
          allOf:
            - $ref: "#/components/schemas/AccessDevices"
            - minItems: 1
            - maxItems: 100
        addedAt:
          description: |
            Timestamp when the access devices listed in `addedAccessDevices` were added to the access. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
            **NOTE:** The timestamp is provided only if `addedAccessDevices` is present.
          type: string
          format: date-time
          maxLength: 64

    AccessDevice:
      description: |
        Information about a single device included in an access:
        * deviceId - a unique identifier of the device included in an access which is the same across all the accesses in which the device is included
        * device - a copy of the device object (if any) provided by the API Consumer when the device was added to the access
        * status - the current status of the device in the context of the access
        * statusInfo - optionally, additional information about the reason for the current device status
      type: object
      properties:
        deviceId:
          $ref: "#/components/schemas/AccessDeviceId"
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        status:
          $ref: "#/components/schemas/DeviceStatus"
        statusInfo:
          $ref: "#/components/schemas/DeviceStatusInfo"
      required:
        - deviceId
        - status

    BaseAccessInfo:
      description: Common attributes of an access to a dedicated network
      type: object
      properties:
        name:
          description: A human-readable name to describe the access
          type: string
          minLength: 1
          maxLength: 1024
        networkId:
          $ref: "#/components/schemas/NetworkId"
        qosProfiles:
          description: (Optional) List of supported QOS profiles usable for the device(s). When absent, all QosProfiles of the network are supported. Only a subset of the QOS profiles of the network is allowed
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/QosProfileName"
        defaultQosProfile:
          $ref: "#/components/schemas/QosProfileName"
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: '../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential'
      required:
        - networkId

    CreateAccessRequest:
      description: |
        Request body used to create a dedicated network access and optionally also add devices to it at the same time.
        **NOTE:** When a three-legged access token is used in the request, the `devices` array MUST NOT be provided.
      allOf:
        - $ref: "#/components/schemas/BaseAccessInfo"
        - type: object
          properties:
            devices:
              allOf:
                - $ref: "#/components/schemas/Devices"
                - minItems: 1
                - maxItems: 100

    CreateAccessSuccess:
      description: |
        Response body used when access was created successfully.
        If the request contained one or more devices (to be added to the access) this response also implies that they were all added successfully and are listed in `addedAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/AccessInfo'
        - $ref: '#/components/schemas/AddedAccessDevices'

    CreateAccessPartialSuccess:
      description: |
        Response body used when access was created successfully but for some devices only.
        Devices added successfully are returned in `addedAccessDevices` while failed devices are listed in `results`.
      allOf:
        - $ref: '#/components/schemas/AccessInfo'
        - $ref: '#/components/schemas/AddedAccessDevices'
        - $ref: '#/components/schemas/ErrorResultsForDevices'
        - required:
            - addedAccessDevices
            - results

    AccessStats:
      description: Statistical information for a dedicated network access
      type: object
      properties:
        totalDevices:
          description: the total number of devices included in the access (regardless of status)
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        totalGranted:
          description: the total number of devices included in the access with status GRANTED
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        totalDenied:
          description: the total number of devices included in the access with status DENIED
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      required:
        - totalDevices
        - totalGranted
        - totalDenied

    AccessInfo:
      description: |
       Information about a dedicated network access which includes the following:
       * id - a unique identifier of the access
       * networkId - network identifier
       * qosProfiles - optionally, a list of QoS profiles relevant for this access, which must be a subset of the QoS profiles already defined for the network.
       * defaultQosProfile - optionally, a default QoS profile for all the devices granted access to this access. This QoS profile must be selected from the QoS profiles defined for this access.
       * stats - access statistics.
       * sink and sinkCredential - optionally, callback information for event notifications pertaining to this access.
      allOf:
        - $ref: "#/components/schemas/BaseAccessInfo"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/AccessId"
            stats:
              $ref: "#/components/schemas/AccessStats"
          required:
            - id
            - stats

    AccessInfosPage:
      description: A page of accesses with information
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: A list of accesses with information
          items:
            $ref: "#/components/schemas/AccessInfo"
          maxItems: 100
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    AddDevicesRequest:
      description: |
        Request body used to add devices to an access.
        **NOTE:** When a three-legged access token is used in the request, the `devices` array MUST NOT be provided.
      type: object
      properties:
        devices:
          description: List of devices to be added to the access
          allOf:
            - $ref: "#/components/schemas/Devices"
            - minItems: 1
            - maxItems: 100

    AddDevicesSuccess:
      description: |
        Response body used when all devices could be added to an access successfully and are listed in `addedAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/AddedAccessDevices'
        - required:
            - addedAccessDevices
            - addedAt

    AddDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be added successfully.
        Devices added successfully are returned in `addedAccessDevices` while failed devices are listed in `results`.
      allOf:
        - $ref: '#/components/schemas/AddedAccessDevices'
        - $ref: "#/components/schemas/ErrorResultsForDevices"
        - required:
            - addedAccessDevices
            - addedAt
            - results

    RemoveDevicesRequest:
      description: Request body used to remove devices from an access
      type: object
      required:
        - accessDeviceIds
      properties:
        accessDeviceIds:
          description: A list of access device ids identifying the devices to be removed from the access
          type: array
          items:
            $ref: "#/components/schemas/AccessDeviceId"
          minItems: 1
          maxItems: 100

    RemoveDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be removed successfully.
        It contains a list of error results, one result per failed device, detailing the result of the failed attempt to remove the device from the access.
        Devices which were successfully removed are not listed.
      allOf:
        - $ref: "#/components/schemas/ErrorResultsForDevices"
        - required:
            - results

    ErrorResults:
      description: |
        Response body used when none of the devices could be processed successfully.
        It contains the overall error information and a list of error results (if any), one result per device.
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - $ref: "#/components/schemas/ErrorResultsForDevices"

    ErrorResultsForDevices:
      description: An object describing error results of an operation targeting multiple devices
      type: object
      properties:
        results:
          description: A list of operation error results, one result per device
          type: array
          items:
            $ref: '#/components/schemas/ErrorResultForDevice'
          minItems: 1
          maxItems: 100

    ErrorResultForDevice:
      description: Information about the error pertaining to an operation for a device
      oneOf:
        - $ref: "#/components/schemas/DeviceValidationError"
        - $ref: "#/components/schemas/DeviceNotFoundError"
        - $ref: "#/components/schemas/DeviceConflictError"
        - $ref: "#/components/schemas/DeviceUnprocessableError"
        - $ref: "#/components/schemas/DeviceMaxExceededError"

    DeviceValidationError:
      description: Error when device failed validation
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - type: object
          properties:
            device:
              $ref: "#/components/schemas/InvalidDevice"
            status:
              enum:
                - 400
            code:
              enum:
                - INVALID_ARGUMENT
                - OUT_OF_RANGE

    DeviceNotFoundError:
      description: Error when device is not found
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - type: object
          properties:
            device:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
            status:
              enum:
                - 404
            code:
              enum:
                - NOT_FOUND
                - IDENTIFIER_NOT_FOUND

    DeviceConflictError:
      description: Error when device is in conflict with another resource
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - type: object
          properties:
            device:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
            status:
              enum:
                - 409
            code:
              enum:
                - ABORTED
                - ALREADY_EXISTS
                - INCOMPATIBLE_STATE

    DeviceUnprocessableError:
      description: Error when device can not be processed
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - type: object
          properties:
            device:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
            status:
              enum:
                - 422
            code:
              enum:
                - SERVICE_NOT_APPLICABLE
                - MISSING_IDENTIFIER
                - UNSUPPORTED_IDENTIFIER

    DeviceMaxExceededError:
      description: Error when device exceeds maximum number of allowed devices
      allOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
        - type: object
          properties:
            device:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
            status:
              enum:
                - 429
            code:
              enum:
                - QUOTA_EXCEEDED

    AccessDeviceEventType:
      description: Enum of event types for the Dedicated Network Accesses API.
      type: string
      enum:
        - org.camaraproject.dedicated-network-accesses.v0.device-status-changed

    AccessDeviceNotificationEvent:
      description: Notification event for device access status changes. Constrains the CloudEvent `type` to access-specific event types.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/AccessDeviceEventType"
      discriminator:
        propertyName: 'type'
        mapping:
          org.camaraproject.dedicated-network-accesses.v0.device-status-changed: "#/components/schemas/EventDeviceStatusChanged"

    EventDeviceStatusChanged:
      description: Event to notify a status change of one or more devices in the context of an access to a dedicated network
      allOf:
        - $ref: "#/components/schemas/AccessDeviceNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Status change details for one or more devices in the context of an access to a dedicated network
              required:
                - accessId
                - accessDevices
              properties:
                accessId:
                  $ref: "#/components/schemas/AccessId"
                accessDevices:
                  type: array
                  items:
                    $ref: "#/components/schemas/AccessDevice"
                  minItems: 1
                  maxItems: 100
          required:
            - data

    Devices:
      description: A list of devices
      type: array
      maxItems: 9007199254740991
      items:
        $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    InvalidDevice:
      description: |
        This object is defined to be able to return any invalid device object to the API invoker.
      type: object
      additionalProperties: true

    QosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an operator is offering can be retrieved by means of the QoS Profile API.
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: "^[a-zA-Z0-9_.-]+$"

  responses:
    CreateAccessBadRequest400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_400_INVALID_ARGUMENT"
            GENERIC_400_INVALID_CREDENTIAL:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_CREDENTIAL"
            GENERIC_400_INVALID_TOKEN:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_TOKEN"
            GENERIC_400_INVALID_SINK:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_400_INVALID_SINK"

    CreateAccessNotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - DEDICATED_NETWORK_ACCESSES.NETWORK_IDENTIFIER_NOT_FOUND
          examples:
            DEDICATED_NETWORK_ACCESSES_404_NETWORK_IDENTIFIER_NOT_FOUND:
              description: Requested network identifier is not found
              value:
                status: 404
                code: DEDICATED_NETWORK_ACCESSES.NETWORK_IDENTIFIER_NOT_FOUND
                message: Network identifier not found.

    CreateAccessConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - INCOMPATIBLE_STATE
          examples:
            DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE:
              $ref: "#/components/examples/DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE"

    AccessDevicesConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ABORTED
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_ABORTED:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_409_ABORTED"
            DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE:
              $ref: "#/components/examples/DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE"

    NoProcessableDevices422:
      description: Unprocessable Content due to that none of the requested devices could be processed successfully
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResults"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device or phone number identification cannot be derived from the three-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.
            GENERIC_422_UNSUPPORTED_IDENTIFIER:
              description: None of the provided identifiers is supported by the implementation
              value:
                status: 422
                code: UNSUPPORTED_IDENTIFIER
                message: The identifier provided is not supported.
            GENERIC_422_UNNECESSARY_IDENTIFIER:
