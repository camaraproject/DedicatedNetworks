openapi: 3.0.3
info:
  title: Dedicated Network - Accesses
  description: |

    This API allows for requesting access to a dedicated network for devices. A device is identified by the generic CAMARA _device object_. For more information about the Dedicated Networks APIs, see the _GeneralDescription_ document in the Dedicated Networks [repository](https://github.com/camaraproject/DedicatedNetworks/).

    An Access to a dedicated network represents the permission for its devices to use the Dedicated Network's reserved connectivity resources. The usage of the resources can be tailored by the access within the constraints of the applicable Network Profile. For example, the access may define a subset of the QoS Profiles defined in the Network Profile and thus limit the set of QoS profiles applicable for the devices using it. The access may also select a different default QoS Profile than the one in the Network Profile. This allows having different QoS profile combinations for different device categories, such as QoS Profile combinations for InterCom devices are separated from those for video cameras within a Media Production case.

    A device may be included in more than one access of the same dedicated network to be able to freely use the resources tailored by each access. Whether such multi-access usage is applicable for a device is at the discretion of the API Provider and is subject to the granting of access.

    A device is identified by the CAMARA `device` object. In addition, the single-device operations (adding, reading or deleting one device of an access) can identify the targeted device from the subject of a three-legged access token.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    # Identifying the device from the access token

    This API distinguishes between multiple-device operations (which target a list of devices) and single-device operations (which target one device), and the way a device is identified differs accordingly:

    - **Multiple-device operations** - creating an access with devices (`POST /accesses`), adding devices (`POST /accesses/{accessId}/devices/add`) and removing devices (`POST /accesses/{accessId}/devices/remove`) - operate on a list of devices and are only supported with a two-legged access token. Each targeted device MUST be identified from a `device` object (for add) or an `accessDeviceId` (for remove) provided in the request body.

    - **Single-device operations** - adding a single device (`POST /accesses/{accessId}/devices`), reading a single device (`GET /accesses/{accessId}/devices/{accessDeviceId}`) and deleting a single device (`DELETE /accesses/{accessId}/devices/{accessDeviceId}`) - are supported with either a two-legged or a three-legged access token:
      - When a two-legged access token is used, the device is identified from the `device` object (for the single-device add) or from the `accessDeviceId` in the path (for read/delete).
      - When a three-legged access token is used, the device is identified from the subject of the access token. In this case, for the single-device add operation, the `device` object MUST NOT be provided in the request body.

    ## Error handling:

    - If, on the single-device add operation, a two-legged access token is used and no `device` object is provided, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.

    - If, on the single-device add operation, a three-legged access token is used and a `device` object is also provided, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.

    **NOTE:** An operation that supports only a two-legged access token requires a scope that a three-legged access token will not carry. A request to such an operation using a three-legged access token therefore fails authorization and the server returns a `403 PERMISSION_DENIED` error.

    # Creating a network access for devices

    An Access for devices is created by performing a `POST` operation on the `/accesses` endpoint. This operation is only supported with a two-legged access token.

    The API Consumer provides the following information

    - the networkId to which access is being given

    - optionally, a name for the access.

    - optionally, a list of identifiers of the devices, using a device object as device identifier

    - optionally, a default QoS Profile can be set for the access and all of its devices (see Network Profiles section in the dedicated-network-profiles API in the [Dedicated Networks repository](https://github.com/camaraproject/DedicatedNetworks/)).

    - optionally, a subset of QoS Profiles from this network can be provided to further restrict which QoS Profiles the devices can access

    - Optionally, callback related information through sink and sinkCredential parameters to receive notifications about the lifecycle events of the devices of the access.

    The API returns an accessId. The accessId is a unique identifier of the access, which remains unchanged during its lifetime. The accessId is needed to query information about the Access (GET /accesses/{accessId}) and to delete Access (DELETE /accesses/{accessId}).

    If a list of devices is provided in the create request, the API also returns `addedAccessDevices` with information for each device that was recognized and could be added to the access. If some but not all of the requested devices could be added, the access is created and detailed information about the failed devices is returned in the `results`. If none of the requested devices could be added, the access is not created and the server returns a `422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE` response with a per-device error result for each device.

    Each device included in an access has a `status`, which describes the device's access to the dedicated network in the context of that access. The status can be one of `REQUESTED`, `GRANTED` or `DENIED`.

    Initially, each device added to the access is in `REQUESTED` state. Before granting the access the API provider checks if it is possible and feasible to allow the device access to the network in accordance with the network/access configuration. The device can access the network only when it is in `GRANTED` state. If the status is `DENIED` it means that the API provider was not able to grant the access or the grant had to be revoked. Find a detailed description of the states of the device's access [here](../../documentation/API_documentation/DedicatedNetworks_GeneralDescription.md#states-of-devices-access-to-the-network).

    Each device added to the access is identified by an accessDeviceId returned in the response. While the device is included in one or more accesses, the accessDeviceId identifies the device within this Accesses API and the same value is used in every access the device belongs to; it is a transient identifier and is not guaranteed to be reassigned the same value if the device is later added again after being removed from all accesses (see the `AccessDeviceId` schema for details). The accessDeviceId can be used to individually query the status of a single AccessDevice (GET /accesses/{accessId}/devices/{accessDeviceId}) and to delete it (DELETE /accesses/{accessId}/devices/{accessDeviceId}) from the access.

    If callback related information is provided, it will be used to notify of state transitions for all devices included in the access.

    ## Error handling:

    - If no dedicated network exists with the given networkId when creating a network access, then the server will return an error with the `404 DEDICATED_NETWORK_ACCESSES.NETWORK_IDENTIFIER_NOT_FOUND` error code.
    - If the dedicated network identified by the networkId is in an incompatible state when creating a network access, e.g. it is in the TERMINATED state, then the server will return an error with the `409 INCOMPATIBLE_STATE` error code.
    - If some but not all requested devices could be added, the API returns a `207` response with `results` containing an error result for each failed device detailing why it failed. If none of the requested devices could be added, the API returns a `422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE` response and the access is not created.
      - If a device cannot be added because the `maxNumberOfDevices` is already reached, an error result with the `429 QUOTA_EXCEEDED` error code is returned for that device.

    # Adding devices to an access

    When an access already exists, additional devices can be added by performing a `POST` operation on the `/accesses/{accessId}/devices/add` endpoint. This multiple-device operation is only supported with a two-legged access token.

    The API Consumer provides the following information

    - a list of identifiers of the devices to be added, using a device object as device identifier

    If all the requested devices could be added, the API returns a response including a list with information for each added device.

    An individual device can be added to an access with the single-device `POST /accesses/{accessId}/devices` operation, which is supported with either a two-legged access token (identifying the device with a `device` object) or a three-legged access token (identifying the device from the access token subject). A single device may also be added through the multiple-device add operation above by supplying a `devices` list with a single entry, but that operation is only supported with a two-legged access token.

    **Single-device vs multiple-device operations**: This API offers two distinct ways to add devices. The *single-device operation* (`POST /accesses/{accessId}/devices`) adds exactly one device and is the only add operation that supports three-legged access tokens. The *multiple-device operation* (`POST /accesses/{accessId}/devices/add`) adds one or more devices from a list and is only supported with a two-legged access token. Adding one device via the multiple-device operation (a `devices` list with a single entry) is **not** the same as the single-device operation: it uses a different scope, requires a two-legged access token, and returns the multiple-device response shape.

    If callback related information was provided for the access, it will be used to also notify of state transitions for all the newly added devices.

    ## Error handling:

    - If some but not all requested devices could be added, the API returns a `207` response with a result detailing which devices were added and which failed.
      - If a device cannot be added because the `maxNumberOfDevices` is already reached, an error result with the `429 QUOTA_EXCEEDED` error code is returned for that device.
    - If none of the requested devices could be added, the API returns a `422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE` response with a per-device error result for each device.

    # Removing devices from an access

    When an access already exists, devices can be removed from it by performing a `POST` operation on the `/accesses/{accessId}/devices/remove` endpoint. This multiple-device operation is only supported with a two-legged access token.

    The API Consumer provides the following information

    - a list of identifiers of the devices to be removed, using an accessDeviceId as device identifier

    The API returns a confirmation of removal and, if not all devices could be removed, a result detailing which devices failed to be removed.

    An individual device can be removed from an access with the single-device `DELETE /accesses/{accessId}/devices/{accessDeviceId}` operation, which is supported with either a two-legged or a three-legged access token. A single device may also be removed through the multiple-device remove operation above by supplying an `accessDeviceIds` list with a single entry, but that operation is only supported with a two-legged access token.

    If callback related information was provided for the access, there will be no further notifications related to the deleted devices.

    ## Error handling:

    - If some but not all requested devices could be removed, the API returns a `207` response with a result detailing which devices failed to be removed.
    - If none of the requested devices could be removed, the API returns a `422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE` response with a per-device error result for each device.

    # Conflict (409) responses on device operations

    Conflicts (`409`) can only occur when adding devices (`createAccess`, `addDevicesToAccess`, `addDeviceToAccess`). The operations distinguish conflicts that concern the whole request from conflicts that concern an individual device:

    - **Whole-request conditions** are returned as an operation-level `409`:
      - `INCOMPATIBLE_STATE` - the dedicated network is in a state that does not allow adding devices (for example, it is in the `TERMINATED` state). This may be detected either at request time or while the request is being processed; in both cases the same operation-level `409 INCOMPATIBLE_STATE` is returned.
      - `ABORTED` - a concurrent modification of the access prevented the request from completing; the request should be retried.
    - **Per-device conditions** are reported per device in the `results` list of the multiple-device operations:
      - `ALREADY_EXISTS` - the device is already included in the access.
      - `INCOMPATIBLE_STATE` - the device itself is in a state that does not allow it to be added, while other devices in the same request may be unaffected. This state is a condition of the device as represented by the serving backend; it is distinct from the device's `status` within the access (`REQUESTED`/`GRANTED`/`DENIED`), which only exists once the device has been added.
      - `ABORTED` - processing of that specific device was prevented by a concurrent modification of the same device; that device should be retried.

    Both `INCOMPATIBLE_STATE` and `ABORTED` may therefore appear either at the operation level (when the whole request is affected - the network, or a concurrent modification of the access) or per device (when an individual device is affected - the device's own state, or a concurrent modification of that device).

    The single-device add operation (`addDeviceToAccess`) targets exactly one device and returns a single response, so its `409` is the union of the conditions that a multiple-device operation would report at the operation level and per device: `ALREADY_EXISTS`, `ABORTED` (a concurrent modification of the access or of the device) and `INCOMPATIBLE_STATE` (the network or the device being in a state that does not allow the device to be added).

    Device removal and access deletion are permitted regardless of state and do not return `409`: `removeDevicesFromAccess`, `DELETE /accesses/{accessId}/devices/{accessDeviceId}` and `DELETE /accesses/{accessId}` always proceed, disregarding the state of the dedicated network and of the devices. A device that is not found is reported with `404`, and a device the API consumer is not authorized to remove with `403`.

    # Querying devices in an access

    All devices included in an access can be queried by performing a `GET` operation on the `/accesses/{accessId}/devices` collection endpoint. This multiple-device listing is only supported with a two-legged access token. The query can be filtered for devices with a specific status, or for devices added to the access after or before certain time.

    These filter criteria can be combined according to the CAMARA filtering rules to allow the API consumer to retrieve information about devices included in the access of particular interest, e.g. recently added devices which reached the `GRANTED` status.

    An individual device in an access can be read with the single-device `GET /accesses/{accessId}/devices/{accessDeviceId}` operation, which is supported with either a two-legged or a three-legged access token. To retrieve several devices at once, use the multiple-device listing (`GET /accesses/{accessId}/devices`) described above, which returns a page of devices and is only supported with a two-legged access token.

    # Querying one or more accesses

    All available accesses of the API consumer can be queried by performing a `GET` operation on the `/accesses` endpoint. These access-level query operations are only supported with a two-legged access token. The query can be filtered for accesses to a specific network, matching a certain name, and/or those including a specific device.

    A specific access of the API consumer can be queried by performing a `GET` operation on the `/accesses/{accessId}` endpoint, where the accessId has been obtained during the _create_ procedure.

    # Deleting an access

    A specific access of the API consumer can be deleted by performing a `DELETE` operation on the `/accesses/{accessId}` endpoint. This operation is only supported with a two-legged access token. Deletion of the access can be interpreted as removal of the permission for all the devices included in the access to access the network.

    # Scopes

    The single-device and multiple-device operations on the devices of an access use different scopes:

    | Operation | Scope | Supported access tokens |
    |---|---|---|
    | `addDeviceToAccess` (`POST /accesses/{accessId}/devices`) | `dedicated-network-accesses:device:create` | two-legged and three-legged |
    | `readAccessDevice` (`GET /accesses/{accessId}/devices/{accessDeviceId}`) | `dedicated-network-accesses:device:read` | two-legged and three-legged |
    | `deleteAccessDevice` (`DELETE /accesses/{accessId}/devices/{accessDeviceId}`) | `dedicated-network-accesses:device:delete` | two-legged and three-legged |
    | `addDevicesToAccess` (`POST /accesses/{accessId}/devices/add`) | `dedicated-network-accesses:devices:add` | two-legged only |
    | `removeDevicesFromAccess` (`POST /accesses/{accessId}/devices/remove`) | `dedicated-network-accesses:devices:remove` | two-legged only |
    | `listAccessDevices` (`GET /accesses/{accessId}/devices`) | `dedicated-network-accesses:devices:read` | two-legged only |

    The scope resource segment reflects the cardinality of the operation: the singular `device` is used for single-device operations, which act on exactly one device (the access device resource addressed by its `accessDeviceId`, or the device identified from the subject of a three-legged access token), while the plural `devices` is used for multiple-device operations, which act on a list of devices.

    This separation of single-device (`device:*`) and multiple-device (`devices:*`) scopes allows a three-legged access token to be limited to the single-device scopes, whose operations act only on the device identified from the subject of the access token. The multiple-device scopes are intended for two-legged access tokens only.

    Separating the scopes in this way allows the API provider to address different application use cases independently: the single-device (`device:*`) scopes suit an application acting on the single device identified by a three-legged access token, while the multiple-device (`devices:*`) scopes suit an application managing devices in bulk with a two-legged access token.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->
    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.2.0-rc.2
  x-camara-commonalities: 0.9.0
servers:
  - url: '{apiRoot}/dedicated-network-accesses/v0.2rc2'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Accesses
    description: Manage accesses to a dedicated network for devices
  - name: Devices
    description: Manage devices of an access to a dedicated network
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/DedicatedNetworks
paths:
  /accesses:
    get:
      tags:
        - Accesses
      summary: Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or matching a certain name and/or for a given dedicated network
      operationId: listAccesses
      description: |
        Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or matching a certain name and/or for a given dedicated network. This operation is only supported with a two-legged access token.
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of accesses to return per page
          schema:
            $ref: '#/components/schemas/PerPage'
        - name: page
          in: query
          description: |
            Number of the page of accesses to return
          schema:
            $ref: '#/components/schemas/Page'
        - name: networkId
          in: query
          description: Dedicated network id
          schema:
            $ref: '#/components/schemas/NetworkId'
        - name: accessDeviceId
          in: query
          description: Access device id
          schema:
            $ref: '#/components/schemas/AccessDeviceId'
        - name: name
          in: query
          description: name of an access
          schema:
            type: string
            maxLength: 1024
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: A list of existing accesses to dedicated networks matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            X-Total-Count:
              $ref: '#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '#/components/headers/x-total-pages'
            Link:
              $ref: '#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfosPage'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
    post:
      tags:
        - Accesses
      summary: Create an access to a dedicated network with given configuration, optionally including devices
      description: |
        Create an access to a dedicated network with the given configuration, and optionally add one or more devices to that access in the same operation. This operation is only supported with a two-legged access token. The `devices` array is optional; when provided, each device is identified by a `device` object.
        - If the request does not include any devices, the access is created and the server returns a `201` response.
        - If the request includes one or more devices, the response depends on the outcome of adding them:
          - If all the devices are added successfully, the server returns a `201` response.
          - If only some of the devices are added successfully, the server returns a `207` response listing the added devices in `addedAccessDevices` and the failed devices in `results`.
          - If none of the devices can be added, the access is not created and the server returns a `422 DEDICATED_NETWORK_ACCESSES.NO_VALID_DEVICE` response with a per-device error result for each device.
        - If the access creation itself is not possible (independently of any devices), the server returns a relevant 4xx response.
        - When a device is successfully added to the access it becomes an access device resource with a device identifier (`accessDeviceId`), the timestamp when it was added (`addedAt`), and status initialised to a `REQUESTED` state. An asynchronous process of granting access for the device is then started.
      operationId: createAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:create
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: Configuration of the access to create, optionally including devices to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      callbacks:
        notifications:
          '{$request.body#/sink}':
            post:
              summary: Device access status notifications callback
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                It will be called when the status of one or more access devices changes.
                Currently only DEVICE_STATUS_CHANGED event is defined.
              operationId: postNotification
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                description: The device access status change event notification
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/AccessDeviceNotificationEvent'
                    examples:
                      DEVICE_STATUS_CHANGED_EXAMPLE:
                        $ref: '#/components/examples/DEVICE_STATUS_CHANGED_EXAMPLE'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/BadRequest400'
                '401':
                  $ref: '#/components/responses/Unauthenticated401'
                '403':
                  $ref: '#/components/responses/PermissionDenied403'
                '410':
                  $ref: '#/components/responses/SinkGone410'
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        '201':
          description: Successful creation of the access for all devices (if any)
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: URL including the resource identifier of the newly created network access.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessSuccess'
        '207':
          description: Successful creation of the access for some devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: URL including the resource identifier of the newly created network access.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessPartialSuccess'
        '400':
          $ref: '#/components/responses/CreateAccessBadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/CreateAccessNotFound404'
        '409':
          $ref: '#/components/responses/CreateAccessConflict409'
        '422':
          $ref: '#/components/responses/AddDevicesNoneProcessed422'
  /accesses/{accessId}:
    get:
      tags:
        - Accesses
      summary: Read access information
      description: |
        Read access information. This operation is only supported with a two-legged access token.
      operationId: readAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AccessId'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: Access information
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfo'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
    delete:
      tags:
        - Accesses
      summary: Delete an access
      description: |
        Delete an access. This operation is only supported with a two-legged access token.
      operationId: deleteAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:delete
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AccessId'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '204':
          description: Successful deletion of the access
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
  /accesses/{accessId}/devices:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
    get:
      tags:
        - Devices
      summary: Read a paged list of devices with information included in the access, optionally filtered for a given device status and/or by given time constraints when a device was added to the access (can be empty)
      description: |
        Read a paged list of devices with information included in the access, optionally filtered for a given device status and/or by given time constraints when a device was added to the access (can be empty). This operation is only supported with a two-legged access token.
      operationId: listAccessDevices
      security:
        - openId:
            - dedicated-network-accesses:devices:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of access devices to return per page
          schema:
            $ref: '#/components/schemas/PerPage'
        - name: page
          in: query
          description: |
            Number of the page of access devices to return
          schema:
            $ref: '#/components/schemas/Page'
        - name: deviceStatus
          in: query
          description: Only access devices with this status are to be returned
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - $ref: '#/components/parameters/AddedAtOrAfter'
        - $ref: '#/components/parameters/AddedAfter'
        - $ref: '#/components/parameters/AddedAtOrBefore'
        - $ref: '#/components/parameters/AddedBefore'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: A list of devices matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            X-Total-Count:
              $ref: '#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '#/components/headers/x-total-pages'
            Link:
              $ref: '#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevicesPage'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
    post:
      tags:
        - Devices
      summary: Add a single device to the access
      description: |
        Add an individual device to an existing access. This single-device operation is supported with both two-legged and three-legged access tokens:
        - If a two-legged access token is used, the device MUST be identified by providing a `device` object in the request body.
        - If a three-legged access token is used, the device is identified from the subject of the access token and therefore the `device` object MUST NOT be provided in the request body. If the `device` object is included, a `422 UNNECESSARY_IDENTIFIER` response is returned.
        - If a two-legged access token is used and no `device` object is provided, a `422 MISSING_IDENTIFIER` response is returned.
        - When the device is successfully added to the access it becomes an access device resource with a device identifier (`accessDeviceId`), the timestamp when it was added (`addedAt`), and status initialised to a `REQUESTED` state. If the `device` object was used to identify the device, this object is also included in the access device, otherwise it is omitted. An asynchronous process of granting access for the device is then started.
        - If the access identified by `accessId` does not exist, a `404 NOT_FOUND` response is returned; if the device identified by the provided `device` object cannot be matched to a device, a `404 IDENTIFIER_NOT_FOUND` response is returned.
        - If the device cannot be added due to a conflict, a `409` response is returned: `ALREADY_EXISTS` if the device is already included in the access, `INCOMPATIBLE_STATE` if the network or the device is in a state that does not allow the device to be added, or `ABORTED` if a concurrent modification prevented the request from completing.

        The resulting `accessDeviceId` is returned in the response body and in the `Location` header, and can subsequently be used to read (`GET /accesses/{accessId}/devices/{accessDeviceId}`) or remove (`DELETE /accesses/{accessId}/devices/{accessDeviceId}`) the device.

        To add one or more devices in a single request, use the multiple-device `POST /accesses/{accessId}/devices/add` operation instead (two-legged access token only).
      operationId: addDeviceToAccess
      security:
        - openId:
            - dedicated-network-accesses:device:create
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: The device to add to the access
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceRequest'
      responses:
        '201':
          description: Successful addition of the device to the access
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: URL including the resource identifier of the newly added access device.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevice'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/AddDeviceNotFound404'
        '409':
          $ref: '#/components/responses/AddDeviceConflict409'
        '422':
          $ref: '#/components/responses/DeviceIdentifier422'
        '429':
          $ref: '#/components/responses/DeviceMaxExceeded429'
  /accesses/{accessId}/devices/add:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
      - $ref: '#/components/parameters/x-correlator'
    post:
      tags:
        - Devices
      summary: Add devices to the access
      description: |
        Add one or more devices to an existing access. This multiple-device operation is only supported with a two-legged access token. Each device to be added MUST be identified by a `device` object in the `devices` array.

        To add an individual device, including when identified from a three-legged access token subject, use the single-device `POST /accesses/{accessId}/devices` operation instead. Note that adding one device through this multiple-device operation (a `devices` list with a single entry) is not equivalent to the single-device operation: it uses a different scope and requires a two-legged access token.
      operationId: addDevicesToAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:add
      requestBody:
        description: The devices to add to the access
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDevicesRequest'
      responses:
        '201':
          description: Successful addition of all the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDevicesSuccess'
        '207':
          description: Partially successful addition of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDevicesPartialSuccess'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/AddDevicesConflict409'
        '422':
          $ref: '#/components/responses/AddDevicesNoneProcessed422'
  /accesses/{accessId}/devices/remove:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
      - $ref: '#/components/parameters/x-correlator'
    post:
      tags:
        - Devices
      summary: Remove devices from the access
      description: |
        Remove one or more devices from the access. This multiple-device operation is only supported with a two-legged access token. Each device to be removed is identified by an `accessDeviceId`.

        To remove an individual device, including when identified from a three-legged access token subject, use the single-device `DELETE /accesses/{accessId}/devices/{accessDeviceId}` operation instead. Note that removing one device through this multiple-device operation (an `accessDeviceIds` list with a single entry) is not equivalent to the single-device operation: it uses a different scope and requires a two-legged access token.
      operationId: removeDevicesFromAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:remove
      requestBody:
        description: The access device identifiers of the devices to remove from the access
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDevicesRequest'
      responses:
        '204':
          description: Successful removal of all the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '207':
          description: Partially successful removal of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveDevicesPartialSuccess'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '422':
          $ref: '#/components/responses/RemoveDevicesNoneProcessed422'
  /accesses/{accessId}/devices/{accessDeviceId}:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
      - name: accessDeviceId
        description: access device identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessDeviceId'
    get:
      tags:
        - Devices
      summary: Read access device information
      description: |
        Read information about a single device included in the access, identified by its `accessDeviceId`.

        This single-device operation supports both two-legged and three-legged access tokens. The device(s) that can be read are restricted based on the information in the access token:
        - When a two-legged access token is used, the access device MUST have been created by the same API client (`client_id`) as the one in the access token.
        - When a three-legged access token is used, the access device MUST have been created for the end user associated with the access token and by the same API client (`client_id`) as the one in the access token. A three-legged caller can therefore only read the device associated with its own access token subject; attempting to read another subject's device results in a `403 INVALID_TOKEN_CONTEXT` response.

        If no access device identified by `accessDeviceId` exists in the access identified by `accessId`, a `404 NOT_FOUND` response is returned. This includes the cases where the `accessDeviceId` is not (or is no longer) known to the server, and where it identifies a device that is not included in this access.
      operationId: readAccessDevice
      security:
        - openId:
            - dedicated-network-accesses:device:read
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: Access device information
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevice'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/SingleDeviceForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
    delete:
      tags:
        - Devices
      summary: Delete an access device
      description: |
        Remove an individual device, identified by its `accessDeviceId`, from the access.

        This single-device operation supports both two-legged and three-legged access tokens. The device(s) that can be deleted are restricted based on the information in the access token:
        - When a two-legged access token is used, the access device MUST have been created by the same API client (`client_id`) as the one in the access token.
        - When a three-legged access token is used, the access device MUST have been created for the end user associated with the access token and by the same API client (`client_id`) as the one in the access token. A three-legged caller can therefore only delete the device associated with its own access token subject; attempting to delete another subject's device results in a `403 INVALID_TOKEN_CONTEXT` response.

        If no access device identified by `accessDeviceId` exists in the access identified by `accessId`, a `404 NOT_FOUND` response is returned. This includes the cases where the `accessDeviceId` is not (or is no longer) known to the server, and where it identifies a device that is not included in this access.

        To remove one or more devices in a single request, use the multiple-device `POST /accesses/{accessId}/devices/remove` operation instead (two-legged access token only).
      operationId: deleteAccessDevice
      security:
        - openId:
            - dedicated-network-accesses:device:delete
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '204':
          description: Successful deletion of the access device
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/SingleDeviceForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
components:
  securitySchemes:
    openId:
      description: OpenID Connect authentication
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    notificationsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '{$request.body#/sinkCredential.credentialType}'
      description: |
        Bearer token for notification delivery. Token format is determined
        by `sinkCredential.credentialType` in the subscription request.
  parameters:
    AddedAtOrAfter:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access no earlier than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.gte
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedAfter:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access later than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.gt
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedAtOrBefore:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access no later than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.lte
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    AddedBefore:
      in: query
      description: |
        Only devices currently included in the access which were successfully added to the access earlier than the given time are to be returned.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).
      name: addedAt.lt
      required: false
      schema:
        format: date-time
        type: string
        maxLength: 64
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  schemas:
    AccessId:
      description: Network access id in UUID format
      type: string
      format: uuid
      maxLength: 36
    NetworkId:
      description: Network id in UUID format
      type: string
      format: uuid
      maxLength: 36
    AccessDeviceId:
      description: |
        Identifier in UUID format of a device within this Accesses API, assigned by the API Provider when the device is added to its first access. While the device is included in one or more accesses, it uniquely identifies the device among the devices of the API Consumer, and the same value is used for that device in every access it belongs to. Which device identifier types the API Provider supports is at its discretion; within the supported set, identifiers that the API Provider resolves to the same device are assigned the same `accessDeviceId`.

        **NOTE:** This is not a unique identifier of an `AccessDevice` resource: because the same `accessDeviceId` is present for the device in every access in which it is included, an individual `AccessDevice` is identified by the combination of `accessId` and `accessDeviceId`. The value is scoped to this Accesses API and is not a device identifier across CAMARA APIs.

        **NOTE:** The `accessDeviceId` is transient, not a durable identifier of the device. It exists only while the device is included in at least one access. Once the device is removed from its last access (for example, by removing it from the access or by deleting the access), the `accessDeviceId` is no longer valid and MUST NOT be used; if the same device is later added again, the API Provider MAY assign a different `accessDeviceId`. API Consumers MUST NOT rely on an `accessDeviceId` remaining valid across periods in which the device belongs to no access.
      type: string
      format: uuid
      maxLength: 36
    DeviceStatus:
      description: |
        The current status of the device in the context of the access. The status can be one of the following:
        * `REQUESTED` - The device was requested to have access to the network. Possible transitions to GRANTED and DENIED states.
        * `GRANTED` - The device was granted access to the network by the CSP, and therefore the device can use the Dedicated Network when the network is in the ACTIVATED state. Possible transition to DENIED state.
        * `DENIED` - The device was denied access to the network by the CSP, and therefore the device can not use the Dedicated Network. The denial can be caused by a variety of conditions, such as lack of resources or system failure.
      type: string
      enum:
        - REQUESTED
        - GRANTED
        - DENIED
    ReasonInfo:
      description: |
        Information about the reason for a change
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the reason
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the reason represents
    DeviceStatusInfo:
      description: Additional information about the reason for the current device status
      type: object
      properties:
        reason:
          description: |
            Information about the reason for a device status change in the context of the access
          allOf:
            - $ref: '#/components/schemas/ReasonInfo'
            - type: object
              properties:
                code:
                  enum:
                    - REQUEST_APPROVED
                    - REQUEST_REJECTED
                    - REQUEST_FAILED
                    - ACCESS_REVOKED
                    - ACCESS_FAILED
    AccessDevicesPage:
      description: A page of access devices
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          description: A list of access devices
          allOf:
            - $ref: '#/components/schemas/AccessDevices'
            - minItems: 0
            - maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
    AccessDevices:
      description: A list of access devices
      type: array
      minItems: 0
      maxItems: 2147483647
      items:
        $ref: '#/components/schemas/AccessDevice'
    AddedAccessDevices:
      description: |
        Information about devices requested and added to the access in either the `createAccess` or the `addDevicesToAccess` operation.
        These are the devices that were added to the access for further processing (the asynchronous process that moves each device from `REQUESTED` to `GRANTED` or `DENIED`), i.e. not immediately rejected due to an error condition.
      type: object
      properties:
        addedAccessDevices:
          description: |
            A list of devices added to the access upon request within either the `createAccess` operation or the `addDevicesToAccess` operation, accepted for further processing (see `DeviceStatus`), i.e. not immediately rejected due to an error condition.
          allOf:
            - $ref: '#/components/schemas/AccessDevices'
            - minItems: 1
            - maxItems: 100
    AccessDevice:
      description: |
        Information about a single device included in an access:
        * accessDeviceId - the identifier of the device within this Accesses API; the same value is used for the device in every access it belongs to
        * device - a copy of the device object provided by the API Consumer when the device was added to the access. It is omitted when the device was identified from the subject of a three-legged access token.
        * status - the current status of the device in the context of the access
        * statusInfo - optionally, additional information about the reason for the current device status
        * addedAt - the timestamp when the device was added to the access
      type: object
      properties:
        accessDeviceId:
          $ref: '#/components/schemas/AccessDeviceId'
        device:
          $ref: '#/components/schemas/Device'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        statusInfo:
          $ref: '#/components/schemas/DeviceStatusInfo'
        addedAt:
          description: |
            Timestamp when the device was added to the access. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
          type: string
          format: date-time
          maxLength: 64
      required:
        - accessDeviceId
        - status
        - addedAt
    BaseAccessInfo:
      description: Common attributes of an access to a dedicated network
      type: object
      properties:
        name:
          description: A human-readable name to describe the access
          type: string
          minLength: 1
          maxLength: 1024
        networkId:
          $ref: '#/components/schemas/NetworkId'
        qosProfiles:
          description: (Optional) List of supported QOS profiles usable for the device(s). When absent, all QosProfiles of the network are supported. Only a subset of the QOS profiles of the network is allowed
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/QosProfileName'
        defaultQosProfile:
          $ref: '#/components/schemas/QosProfileName'
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          allOf:
            - $ref: '#/components/schemas/Sink'
        sinkCredential:
          $ref: '#/components/schemas/SinkCredential'
      required:
        - networkId
    CreateAccessRequest:
      description: |
        Attributes used to create a dedicated network access, optionally including one or more devices to be added to the access.
        The `devices` array is optional: when omitted, the access is created without any devices; when provided, each device is identified by a `device` object.
      allOf:
        - $ref: '#/components/schemas/BaseAccessInfo'
        - type: object
          properties:
            devices:
              allOf:
                - $ref: '#/components/schemas/Devices'
                - minItems: 1
                - maxItems: 100
    CreateAccessSuccess:
      description: |
        Response body used when access was created successfully.
        If the request contained devices (to be added to the access) this response also implies that they were all added successfully and are listed in `addedAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/AccessInfo'
        - $ref: '#/components/schemas/AddedAccessDevices'
    CreateAccessPartialSuccess:
      description: |
        Response body used when the access was created successfully and at least one, but not all, of the requested devices were added.
        Devices added successfully are returned in `addedAccessDevices` while failed devices are listed in `results`.
      allOf:
        - $ref: '#/components/schemas/AccessInfo'
        - $ref: '#/components/schemas/AddedAccessDevices'
        - $ref: '#/components/schemas/AddDevicesErrorResults'
        - required:
            - addedAccessDevices
            - results
    AccessStats:
      description: Statistical information for a dedicated network access
      type: object
      properties:
        totalDevices:
          description: the total number of devices included in the access (regardless of status)
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        totalGranted:
          description: the total number of devices included in the access with status GRANTED
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        totalDenied:
          description: the total number of devices included in the access with status DENIED
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
      required:
        - totalDevices
        - totalGranted
        - totalDenied
    AccessInfo:
      description: |
        Information about a dedicated network access which includes the following:
        * id - a unique identifier of the access
        * networkId - network identifier
        * qosProfiles - optionally, a list of QoS profiles relevant for this access, which must be a subset of the QoS profiles already defined for the network.
        * defaultQosProfile - optionally, a default QoS profile for all the devices granted access to this access. This QoS profile must be selected from the QoS profiles defined for this access.
        * stats - access statistics.
        * sink and sinkCredential - optionally, callback information for event notifications pertaining to this access.
      allOf:
        - $ref: '#/components/schemas/BaseAccessInfo'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/AccessId'
            stats:
              $ref: '#/components/schemas/AccessStats'
          required:
            - id
            - stats
    AccessInfosPage:
      description: A page of accesses with information
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: A list of accesses with information
          items:
            $ref: '#/components/schemas/AccessInfo'
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
    AddDevicesRequest:
      description: Request body used to add devices to an access
      type: object
      required:
        - devices
      properties:
        devices:
          description: List of devices to be added to the access
          allOf:
            - $ref: '#/components/schemas/Devices'
            - minItems: 1
            - maxItems: 100
    AddDeviceRequest:
      description: |
        Request body used to add a single device to an access.
        **NOTE:** When a two-legged access token is used, the `device` object MUST be provided to identify the device.
        When a three-legged access token is used, the device is identified from the subject of the access token and the `device` object MUST NOT be provided.
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
    AddDevicesSuccess:
      description: |
        Response body used when all devices could be added to an access successfully and are listed in `addedAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/AddedAccessDevices'
        - required:
            - addedAccessDevices
    AddDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be added successfully.
        Devices added successfully are returned in `addedAccessDevices` while failed devices are listed in `results`.
      allOf:
        - $ref: '#/components/schemas/AddedAccessDevices'
        - $ref: '#/components/schemas/AddDevicesErrorResults'
        - required:
            - addedAccessDevices
            - results
    RemoveDevicesRequest:
      description: Request body used to remove devices from an access
      type: object
      additionalProperties: false
      required:
        - accessDeviceIds
      properties:
        accessDeviceIds:
          description: A list of access device ids identifying the devices to be removed from the access
          type: array
          items:
            $ref: '#/components/schemas/AccessDeviceId'
          minItems: 1
          maxItems: 100
    RemoveDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be removed successfully.
        It contains a list of error results, one result per failed device, detailing the result of the failed attempt to remove the device from the access.
        Devices which were successfully removed are not listed.
      allOf:
        - $ref: '#/components/schemas/RemoveDevicesErrorResults'
        - required:
            - results
    AddDevicesErrorResults:
      description: An object describing the per-device error results of an operation adding devices to an access.
      type: object
      properties:
        results:
          description: A list of error results, one result per device that could not be added.
          type: array
          items:
            $ref: '#/components/schemas/AddDeviceErrorResult'
          minItems: 1
          maxItems: 100
    AddDeviceErrorResult:
      description: Information about the error pertaining to a device that could not be added to the access. The device is identified by the `device` object provided in the request.
      oneOf:
        - $ref: '#/components/schemas/DeviceValidationError'
        - $ref: '#/components/schemas/DeviceNotFoundError'
        - $ref: '#/components/schemas/DeviceForbiddenError'
        - $ref: '#/components/schemas/DeviceConflictError'
        - $ref: '#/components/schemas/DeviceUnprocessableError'
        - $ref: '#/components/schemas/DeviceMaxExceededError'
    AddDevicesNoneProcessed:
      description: |
        Response body used when none of the requested devices could be added to the access.
        It contains the overall error information and a list of error results, one result per device.
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - $ref: '#/components/schemas/AddDevicesErrorResults'
        - required:
            - results
    RemoveDevicesErrorResults:
      description: An object describing the per-device error results of an operation removing devices from an access.
      type: object
      properties:
        results:
          description: A list of error results, one result per device that could not be removed.
          type: array
          items:
            $ref: '#/components/schemas/RemoveDeviceErrorResult'
          minItems: 1
          maxItems: 100
    RemoveDeviceErrorResult:
      description: Information about the error pertaining to a device that could not be removed from the access. The device is identified by its `accessDeviceId`.
      oneOf:
        - $ref: '#/components/schemas/AccessDeviceNotFoundError'
        - $ref: '#/components/schemas/AccessDeviceForbiddenError'
    RemoveDevicesNoneProcessed:
      description: |
        Response body used when none of the requested devices could be removed from the access.
        It contains the overall error information and a list of error results, one result per device.
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - $ref: '#/components/schemas/RemoveDevicesErrorResults'
        - required:
            - results
    DeviceValidationError:
      description: Error when device failed validation
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/InvalidDevice'
            status:
              enum:
                - 400
            code:
              enum:
                - INVALID_ARGUMENT
                - OUT_OF_RANGE
          required:
            - device
    DeviceForbiddenError:
      description: Error when the API consumer is not authorized to add the device identified by the provided `device` object (for example, because the consumer is not permitted to act on this device).
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/Device'
            status:
              enum:
                - 403
            code:
              enum:
                - PERMISSION_DENIED
          required:
            - device
    DeviceNotFoundError:
      description: Error when the device identified by the provided `device` object cannot be matched to a device.
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/Device'
            status:
              enum:
                - 404
            code:
              enum:
                - IDENTIFIER_NOT_FOUND
          required:
            - device
    DeviceConflictError:
      description: Error when the device cannot be added due to a conflict - it is already included in the access (`ALREADY_EXISTS`), its state does not allow it to be added (`INCOMPATIBLE_STATE`), or its processing was aborted by a concurrent modification of the same device (`ABORTED`).
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/Device'
            status:
              enum:
                - 409
            code:
              enum:
                - ALREADY_EXISTS
                - INCOMPATIBLE_STATE
                - ABORTED
          required:
            - device
    DeviceUnprocessableError:
      description: Error when device can not be processed
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/Device'
            status:
              enum:
                - 422
            code:
              enum:
                - SERVICE_NOT_APPLICABLE
                - UNSUPPORTED_IDENTIFIER
          required:
            - device
    DeviceMaxExceededError:
      description: Error when device exceeds maximum number of allowed devices
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/Device'
            status:
              enum:
                - 429
            code:
              enum:
                - QUOTA_EXCEEDED
          required:
            - device
    AccessDeviceForbiddenError:
      description: Error when the API consumer is not authorized to remove the access device identified by the `accessDeviceId` (for example, because the access device was not created by the same API client).
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            accessDeviceId:
              $ref: '#/components/schemas/AccessDeviceId'
            status:
              enum:
                - 403
            code:
              enum:
                - PERMISSION_DENIED
          required:
            - accessDeviceId
    AccessDeviceNotFoundError:
      description: Error when the access device identified by the `accessDeviceId` is not found.
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            accessDeviceId:
              $ref: '#/components/schemas/AccessDeviceId'
            status:
              enum:
                - 404
            code:
              enum:
                - NOT_FOUND
          required:
            - accessDeviceId
    AccessDeviceEventType:
      description: Enum of event types for the Dedicated Network Accesses API.
      type: string
      enum:
        - org.camaraproject.dedicated-network-accesses.v0.device-status-changed
    AccessDeviceNotificationEvent:
      description: Notification event for device access status changes. Constrains the CloudEvent `type` to access-specific event types.
      allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/AccessDeviceEventType'
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.dedicated-network-accesses.v0.device-status-changed: '#/components/schemas/EventDeviceStatusChanged'
    EventDeviceStatusChanged:
      description: Event to notify a status change of one or more devices in the context of an access to a dedicated network
      allOf:
        - $ref: '#/components/schemas/AccessDeviceNotificationEvent'
        - type: object
          properties:
            data:
              type: object
              description: Status change details for one or more devices in the context of an access to a dedicated network
              required:
                - accessId
                - accessDevices
              properties:
                accessId:
                  $ref: '#/components/schemas/AccessId'
                accessDevices:
                  type: array
                  description: The access devices whose status changed, each with its updated status
                  items:
                    $ref: '#/components/schemas/AccessDevice'
                  minItems: 1
                  maxItems: 100
          required:
            - data
    Devices:
      description: A list of devices
      type: array
      maxItems: 2147483647
      items:
        $ref: '#/components/schemas/Device'
    InvalidDevice:
      description: |
        This object is defined to be able to return any invalid device object to the API invoker.
      type: object
      additionalProperties: true
    QosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an operator is offering can be retrieved by means of the QoS Profile API.
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: ^[a-zA-Z0-9_.-]+$
    PerPage:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 20
      description: Number of items per page.
      example: 20
    Page:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      default: 1
      description: Current page number (1-indexed).
      example: 1
    XCorrelator:
      type: string
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    TotalCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Total number of items matching the query, after filters applied. MAY be omitted where a full count query is prohibitively expensive.
      example: 87
    TotalPages:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Total number of pages. Equals ceil(totalCount / perPage). MAY be omitted where totalCount is omitted.
      example: 5
    Sink:
      description: The address to which events shall be delivered using the selected protocol.
      type: string
      format: uri
      maxLength: 2048
      pattern: ^https:\/\/.+$
      example: https://endpoint.example.com/sink
    SinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: '#/components/schemas/AccessTokenCredential'
          PRIVATE_KEY_JWT: '#/components/schemas/PrivateKeyJWTCredential'
      required:
        - credentialType
    AccessTokenCredential:
      type: object
      description: An access token credential. This type of credential is meant to be used by API Consumers that have limited capabilities to handle authorization requests.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a token granting access to the target resource.
              type: string
              maxLength: 4096
              writeOnly: true
            accessTokenExpiresUtc:
              type: string
              format: date-time
              maxLength: 64
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: '2023-07-03T12:27:08.312Z'
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              writeOnly: true
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    PrivateKeyJWTCredential:
      type: object
      description: Use PRIVATE_KEY_JWT to get an access token. This type of credential is to be used by clients that have an authorization server.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            clientId:
              description: The client ID used to authenticate when requesting an access token using PRIVATE_KEY_JWT.
              type: string
              maxLength: 128
              writeOnly: true
            tokenUri:
              description: The URI where to request an access token using PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              writeOnly: true
            jwksUri:
              description: The URI used to request the public key to verify that the JWT assertion was signed by PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              readOnly: true
    Pagination:
      description: Pagination details helping to navigate through paged results efficiently.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        perPage:
          $ref: '#/components/schemas/PerPage'
        totalCount:
          $ref: '#/components/schemas/TotalCount'
        totalPages:
          $ref: '#/components/schemas/TotalPages'
    ErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
    PhoneNumber:
      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: ^\+[1-9][0-9]{4,14}$
      maxLength: 16
      example: '+123456789'
    NetworkAccessIdentifier:
      description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
      type: string
      maxLength: 2048
      example: 123456789@example.com
    SingleIpv4Address:
      description: A single IPv4 address with no subnet mask
      type: string
      format: ipv4
      maxLength: 15
      example: 84.125.93.10
    Port:
      description: TCP or UDP port number
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
    DeviceIpv4Address:
      type: object
      description: |
        The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).

        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.

        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)

        In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.
      properties:
        publicAddress:
          $ref: '#/components/schemas/SingleIpv4Address'
        privateAddress:
          $ref: '#/components/schemas/SingleIpv4Address'
        publicPort:
          $ref: '#/components/schemas/Port'
      anyOf:
        - required:
            - publicAddress
            - privateAddress
        - required:
            - publicAddress
            - publicPort
      example:
        publicAddress: 84.125.93.10
        publicPort: 59765
    SingleIpv6Address:
      description: A single IPv6 address with no subnet mask
      type: string
      format: ipv6
      maxLength: 45
      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
    DeviceIpv6Address:
      description: |
        The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).
      allOf:
        - $ref: '#/components/schemas/SingleIpv6Address'
    Device:
      description: |
        End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.
            The developer can choose to provide the below specified device identifiers:
            * `ipv4Address`
            * `ipv6Address`
            * `phoneNumber`
            * `networkAccessIdentifier`
            NOTE1: the network operator might support only a subset of these options. The API Consumer can provide multiple identifiers to ensure compatibility across different network operators. In this case, the API Provider will use one of the identifiers for the API logic without performing any matching checks among the provided identifiers.
            NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        networkAccessIdentifier:
          $ref: '#/components/schemas/NetworkAccessIdentifier'
        ipv4Address:
          $ref: '#/components/schemas/DeviceIpv4Address'
        ipv6Address:
          $ref: '#/components/schemas/DeviceIpv6Address'
      minProperties: 1
    Source:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      description: |
        Identifies the context in which an event happened - be a non-empty `URI-reference` like:
        - URI with a DNS authority:
          * https://github.com/cloudevents
          * mailto:cncf-wg-serverless@lists.cncf.io
        - Universally-unique URN with a UUID:
          * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
        - Application-specific identifier:
          * /cloudevents/spec/pull/123
          * 1-555-123-4567
      example: https://notificationSendServer12.example.com
    DateTime:
      type: string
      format: date-time
      maxLength: 64
      description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
      example: '2018-04-05T17:31:00Z'
    CloudEvent:
      type: object
      description: |
        CloudEvents 1.0 specification envelope.
        This schema is the stable base for all CAMARA event notifications.
        It imposes no constraints on `type` values or `data` structure —
        those concerns belong to the API-specific and lifecycle group schemas.
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          type: string
          maxLength: 256
          description: Identifier of this event, unique within the source context.
        source:
          $ref: '#/components/schemas/Source'
        type:
          type: string
          maxLength: 512
          description: |
            Identifies the event type. CAMARA APIs use reverse-DNS notation:
            `org.camaraproject.<api-name>.<event-version>.<event-name>`
            The api-name segment makes each type globally unique across API groups.
        specversion:
          type: string
          description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          enum:
            - '1.0'
        datacontenttype:
          type: string
          description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          enum:
            - application/json
        data:
          type: object
          description: Event details payload. Structure is defined by each concrete event schema.
        time:
          $ref: '#/components/schemas/DateTime'
  responses:
    CreateAccessBadRequest400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: '#/components/examples/GENERIC_400_INVALID_ARGUMENT'
            GENERIC_400_INVALID_CREDENTIAL:
              $ref: '#/components/examples/GENERIC_400_INVALID_CREDENTIAL'
            GENERIC_400_INVALID_TOKEN:
              $ref: '#/components/examples/GENERIC_400_INVALID_TOKEN'
            GENERIC_400_INVALID_SINK:
              $ref: '#/components/examples/GENERIC_400_INVALID_SINK'
    SingleDeviceForbidden403:
      description: |
        Forbidden. In addition to the generic `PERMISSION_DENIED`, the single-device operations may return `INVALID_TOKEN_CONTEXT` when a three-legged access token is used and the targeted device (identified by `accessDeviceId`) does not correspond to the subject of the access token.
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - INVALID_TOKEN_CONTEXT
          examples:
            GENERIC_403_PERMISSION_DENIED:
              $ref: '#/components/examples/GENERIC_403_PERMISSION_DENIED'
            DEDICATED_NETWORK_ACCESSES_403_INVALID_TOKEN_CONTEXT:
              description: The device targeted by `accessDeviceId` is not consistent with the subject of the three-legged access token
              value:
                status: 403
                code: INVALID_TOKEN_CONTEXT
                message: accessDeviceId is not consistent with access token.
    CreateAccessNotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - DEDICATED_NETWORK_ACCESSES.NETWORK_IDENTIFIER_NOT_FOUND
          examples:
            DEDICATED_NETWORK_ACCESSES_404_NETWORK_IDENTIFIER_NOT_FOUND:
              description: Requested network identifier is not found
              value:
                status: 404
                code: DEDICATED_NETWORK_ACCESSES.NETWORK_IDENTIFIER_NOT_FOUND
                message: Network identifier not found.
    AddDeviceNotFound404:
      description: |
        Not found. `NOT_FOUND` is returned when the access identified by `accessId` does not exist; `IDENTIFIER_NOT_FOUND` is returned when the device identified by the provided `device` object cannot be matched to a device.
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              $ref: '#/components/examples/GENERIC_404_NOT_FOUND'
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              $ref: '#/components/examples/GENERIC_404_IDENTIFIER_NOT_FOUND'
    CreateAccessConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - INCOMPATIBLE_STATE
          examples:
            DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE:
              $ref: '#/components/examples/DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE'
    AddDeviceConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ALREADY_EXISTS
                      - ABORTED
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_ALREADY_EXISTS:
              $ref: '#/components/examples/GENERIC_409_ALREADY_EXISTS'
            GENERIC_409_ABORTED:
              $ref: '#/components/examples/GENERIC_409_ABORTED'
            DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE:
              $ref: '#/components/examples/DEDICATED_NETWORK_ACCESSES_409_INCOMPATIBLE_STATE'
    AddDevicesConflict409:
      description: Conflict
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
