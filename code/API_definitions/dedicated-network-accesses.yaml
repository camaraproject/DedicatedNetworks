openapi: 3.0.3
info:
  title: Dedicated Network - Accesses
  description: |

    This API allows for requesting access to a dedicated network for devices. A device is identified by the generic CAMARA _device object_. For more information about the Dedicated Networks APIs, see the _GeneralDescription_ document in the Dedicated Networks [repository](https://github.com/camaraproject/DedicatedNetworks/).

    An **access group** represents a set of devices sharing the same permission to use a dedicated network's reserved connectivity resources: it carries the network the group applies to, the QoS policy for its devices, and the notification `sink`. The usage of the network's resources can be tailored by the access group within the constraints of the applicable Network Profile. For example, an access group may define a subset of the QoS Profiles defined in the Network Profile and thus limit the set of QoS profiles applicable for the devices in the group. This allows having different QoS profile combinations for different device categories, such as QoS Profile combinations for InterCom devices being separated from those for video cameras within a Media Production case.

    Each device admitted to an access group has its own **access**: an individually addressable resource carrying the device identifier and the device's own admission status. A device is identified by the CAMARA `device` object. Out of the four identifiers defined by the `device` object, this API supports the Phone Number, IPv4 address and IPv6 address assigned by the mobile network operator; the Network Access Identifier is not supported (see `Device` NOTE2 in the Commonalities API definition).

    A device may hold accesses in more than one access group on the same network at the same time. The `qosProfiles` restrictions of these access groups compose by union. If more than one of the groups sets an explicit `defaultQosProfile` and they differ, resolution of the effective default is provider-specific; the effective profile actually in force is reported on each of the device's accesses (see `effectiveQosProfile` below), so the outcome of any such conflict is always observable. The API provider does not correlate or compare device identifiers across access groups to detect this situation.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:BEGIN -->

    # Identifying the device from the access token

    This API requires the API consumer to identify a device as the subject of the API as follows:
    - When the API is invoked using a two-legged access token, the subject will be identified from the optional `device` object, which therefore MUST be provided.
    - When a three-legged access token is used however, this optional identifier MUST NOT be provided, as the subject will be uniquely identified from the access token.

    This approach simplifies API usage for API consumers using a three-legged access token to invoke the API by relying on the information that is associated with the access token and was identified during the authentication process.

    ## Error handling:

    - If the subject cannot be identified from the access token and the optional `device` object is not included in the request, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.

    - If the subject can be identified from the access token and the optional `device` object is also included in the request, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.
    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:END -->

    This applies to `POST /accesses` and `POST /retrieve-accesses`, the two single-subject operations that accept a device identifier. `POST /batch-create-accesses` and `POST /batch-delete-accesses` deviate from it: both accept **two-legged access tokens only** and require every device or access to be identified explicitly in the request body, because a batch inherently addresses more than one device. Using a three-legged access token on either batch operation results in a `403 INVALID_TOKEN_CONTEXT` error.

    # Creating an access group

    An access group is created by performing a `POST` operation on the `/access-groups` endpoint.

    The API Consumer provides the following information:

    - the `networkId` the group applies to

    - optionally, a `name` to describe the group

    - optionally, a default QoS Profile for the group (see Network Profiles section in the dedicated-network-profiles API in the [Dedicated Networks repository](https://github.com/camaraproject/DedicatedNetworks/))

    - optionally, a subset of QoS Profiles from this network to further restrict which QoS Profiles the group's devices can access

    - optionally, callback related information through `sink` and `sinkCredential` parameters to receive notifications about the admission status of the group's accesses

    - optionally, a list of devices (1-100) to admit to the group immediately upon creation

    The API returns an `accessGroupId`, which remains unchanged during the group's lifetime and is needed to query (`GET /access-groups/{accessGroupId}`) or delete (`DELETE /access-groups/{accessGroupId}`) the group.

    If no `devices` were supplied, the server returns `201` with the created access group. If `devices` were supplied, the server always returns `207`, whether every device was admitted or not, together with one entry per requested device: the complete created access resource for each device that was admitted, and the device identifier plus an error `code` and `message` for each device that was not. This is so regardless of how many devices succeeded - the group itself is always created, so no code that also indicates "nothing was created" is applicable.

    ## Error handling:

    - If the dedicated network identified by `networkId` is in an incompatible state, e.g. it is in the `TERMINATED` state, then the server will return an error with the `409 INCOMPATIBLE_STATE` error code and no access group is created.
    - If the request could not be processed at all - nothing identifiable to act on - the server returns `422`, and no access group is created either.
    - If `devices` were supplied and the network's `maxNumberOfDevices` limit binds partway through the request, devices are admitted up to the limit and the remaining devices each get a per-device failure with the `DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED` error code. The order of the `devices` array in the request determines which devices are admitted when the limit binds.
    - A device that already has an access in this group, matched on an exact identifier match, gets a per-device failure with the `ALREADY_EXISTS` error code.

    # Querying and deleting access groups

    All access groups of the API consumer can be queried by performing a `GET` operation on the `/access-groups` endpoint, optionally filtered by `networkId`, and is paginated.

    A specific access group can be queried by performing a `GET` operation on the `/access-groups/{accessGroupId}` endpoint.

    A specific access group can be deleted by performing a `DELETE` operation on the `/access-groups/{accessGroupId}` endpoint. Deleting an access group deletes every access in it. No notification is sent for this: the deletion is consumer-initiated, and an access that no longer exists has no terminal state to report - it is discoverable as `404` on a subsequent read.

    # Creating an access for a device

    Once an access group exists, an access for a single device is created by performing a `POST` operation on the `/accesses` endpoint.

    The API Consumer provides the following information:

    - the `accessGroupId` of the access group the device is to be admitted to

    - the identifier of the device - either in the `device` object or in the access token (see "Identifying the device from the access token" above)

    The API returns an `accessId`. The `accessId` is a unique identifier of the access, which remains unchanged during its lifetime, and is needed to query (`GET /accesses/{accessId}`) or delete (`DELETE /accesses/{accessId}`) the access.

    The access is initially in `REQUESTED` state. The device can use the network only once the access is in `GRANTED` state.

    ## Error handling:

    - If the `accessGroupId` does not identify an existing access group, the server will return an error with the `404 NOT_FOUND` error code.
    - If the dedicated network the access group applies to is in an incompatible state, e.g. it is in the `TERMINATED` state, then the server will return an error with the `409 INCOMPATIBLE_STATE` error code.
    - If an access already exists for the exact same device identifier in this access group, the server will return an error with the `409 ALREADY_EXISTS` error code. The server only detects this when the identifier matches exactly; it does not correlate different identifier types to decide whether they refer to the same device.
    - If the network has already reached its `maxNumberOfDevices` limit, the server will return an error with the `422 DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED` error code.

    # Creating accesses for multiple devices

    Accesses for multiple devices in the same access group can be created in one request by performing a `POST` operation on the `/batch-create-accesses` endpoint. This is the throughput-oriented counterpart to `POST /accesses`, for API consumers that need to admit many devices at once.

    The API Consumer provides the `accessGroupId` and an explicit list of `devices` (1-100 devices). Every device in the list is admitted to the group as its own, individually addressable access, exactly as if `POST /accesses` had been called once per device with the same `accessGroupId`.

    The server always returns `207`, whether every device was admitted or not, with one entry per requested device: the complete created access resource for each device that was admitted, and the device identifier plus an error `code` and `message` for each device that was not. A `207` response never carries a nested HTTP status per device, only a domain-specific `code`. If the request could not be processed at all, the server returns `422` instead, and no access is created.

    ## Error handling:

    - If the `accessGroupId` does not identify an existing access group, the server will return an error with the `404 NOT_FOUND` error code for the whole request.
    - If the dedicated network the access group applies to is in an incompatible state, e.g. it is in the `TERMINATED` state, then the server will return an error with the `409 INCOMPATIBLE_STATE` error code for the whole request.
    - If the network's `maxNumberOfDevices` limit binds partway through the request, devices are admitted up to the limit and the remaining devices each get a per-device failure with the `DEDICATED_NETWORK_ACCESSES.MAX_NUMBER_OF_DEVICES_REACHED` error code. The order of the `devices` array in the request determines which devices are admitted when the limit binds.
    - A device that already has an access for this group, matched on an exact identifier match, gets a per-device failure with the `ALREADY_EXISTS` error code.

    # Querying accesses

    All accesses of the API consumer can be queried by performing a `GET` operation on the `/accesses` endpoint. The result can be filtered by `accessGroupId`, `networkId` and/or `status`, and is paginated.

    A specific access of the API consumer can be queried by performing a `GET` operation on the `/accesses/{accessId}` endpoint, where the `accessId` has been obtained during the _create_ procedure.

    Accesses can also be queried by device by performing a `POST` operation on the `/retrieve-accesses` endpoint, optionally also filtered by `networkId` and/or `accessGroupId`. This uses `POST` rather than `GET` because the device identifier may be personal data; the result is an unpaginated list bounded at 100 entries. If no access is found for the given device, an empty array is returned.

    # Deleting accesses

    A specific access of the API consumer can be deleted by performing a `DELETE` operation on the `/accesses/{accessId}` endpoint. Deletion of the access removes the permission for the device to use the network under that access group.

    Multiple accesses can be deleted in one request by performing a `POST` operation on the `/batch-delete-accesses` endpoint, providing the list of `accessIds` to delete (1-100 accesses); the accesses do not need to belong to the same access group.

    The server always returns `207`, with one entry per requested `accessId`: a bare confirmation for each access that was deleted, and the `accessId` plus an error `code` and `message` for each access that was not. If none of the requested accesses could be deleted, the server returns `422` instead, with the overall error information plus the same per-`accessId` detail.

    # Access status

    An access reports its own admission status (`REQUESTED`/`GRANTED`/`DENIED`) with a reason code in `statusInfo`. This status reflects the outcome of the create/admission decision and the access's own lifecycle; it is distinct from the outcome of a batch operation, which is reported per device in the batch response only, never in the resource itself.

    When the dedicated network an access group applies to transitions to `TERMINATED`, every access in every access group on that network that was `GRANTED` transitions to `DENIED`, using the existing `ACCESS_REVOKED` reason code with a `message` explaining the cause. No separate handling is required in the `dedicated-network` API: by the time a network reaches `TERMINATED` its accesses are already `DENIED`, so network deletion needs no accesses-specific description there either.

    # Notifications about access status changes

    If `sink` (and, if required, `sinkCredential`) was provided when creating an access group, the API notifies the consumer of admission status changes for the accesses in that group via the callback described for `POST /access-groups`.

    Two kinds of notification exist:
    - An individual or partial change is reported as `…v0.access-status-changed`, whose `data` carries the `accessGroupId` and a `statusChanges` list of 1-100 entries, each identifying its `accessId`, the new `status`, and `statusInfo` only. It never embeds a device object or the access resource, so the consumer relies on the resource (`GET /accesses/{accessId}`) as the source of truth for anything beyond the status itself. When a provider batches multiple status changes into one notification is implementation-determined.
    - A uniform change across every access in a group - for example, the network the group applies to transitioning to `TERMINATED` - is reported as `…v0.access-group-status-changed`, whose `data` carries the `accessGroupId`, `status` and `statusInfo` directly, without enumerating every access. A provider MUST only send this event when the change applies to every access in the group; otherwise it uses the per-access batch event above.

    All accesses in one access group share the same `sink`, so a notification is always scoped to one group.

    `source` identifies the notifying provider, not a specific access or access group - a single notification's `statusChanges` list may span multiple accesses within the group.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->
    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

