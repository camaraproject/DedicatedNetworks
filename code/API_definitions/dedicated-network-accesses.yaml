openapi: 3.0.3
info:
  title: Dedicated Network - Accesses
  description: |

    This API allows for requesting access to a dedicated network for devices. A device is identified by the generic CAMARA _device object_. For more information about the Dedicated Networks APIs, see the _GeneralDescription_ document in the Dedicated Networks [repository](https://github.com/camaraproject/DedicatedNetworks/).

    An Access to a dedicated network represents the permission for its devices to use the Dedicated Network's reserved connectivity resources. The usage of the resources can be tailored by the access within the constraints of the applicable Network Profile. For example, the access may define a subset of the QoS Profles defined in the Network Profile and thus limit the set of QoS profiles applicable for the devices using it. The access may also select a different default QoS Profile than the one in the Network Profile. This allows having different QoS profile combinations for different device categories, such as QoS Profile combinations for InterCom devices are separated from those for video cameras within a Media Production case.

    A device is identified by the CAMARA `device` object. Out of the four identifiers defined by the `device` object, this API supports the Phone Number assigned by the mobile network operator as the only option.

    Notes:
    1. Phone Number is the required identifier in a `device` object for this API. Any other identifier present in a `device` object received by this API will be silently ignored but will be retained and echoed back.
    2. A `device` object without a Phone Number will be rejected by this API.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    # Identifying the device from the access token

    This API handles multiple devices in one request and therefore does not support identifying the device from the access token. Only the `device` object is used for identifying a device.
    ## Error handling:

    - If there is no `device` object, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.


    # Creating a network access for devices

    An Access for devices is created by performing a `POST` operation on the `/accesses` endpoint.

    The API Consumer provides the following information

    - the networkId to which access is being given

    - optionally, a list of identifiers of the devices, using a device object as device identifier

    - optionally, a default QoS Profile can be set for the access and all of its devices (see Network Profiles section in the dedicated-network-profiles API in the [Dedicated Networks repository](https://github.com/camaraproject/DedicatedNetworks/)).

    - optionally, a subset of QoS Profiles from this network can be provided to further restrict which QoS Profiles the devices can access

    - Optionally, callback related information through sink and sinkCredential parameters to receive notifications about the lifecycle events of the devices of the access.

    The API returns an accessId. The accessId is a unique identifier of the access, which remains unchanged during its lifetime. The accessId is needed to query the status of the Access (GET /accesses/{accessId}) and to delete Access (DELETE accesses/{accessId}).

    If a list of devices is provided in the create request, the API also returns a `recentAccessDevices` with information for each device that was recognized and could be included in the access. The intention is to simplify for the API consumer tracking of the status of the recently added devices by simply reading the access information. Since `recentAccessDevices` contains only devices added in the last operation it is therefore limited to 100 devices. Even if none of the requested devices could be added the access is created and detailed information about the failed devices is returned in the `results`.

    Initially, each device included in the access is in `REQUESTED` state. Before granting the access the API provider checks if it is possible and feasible to allow the device access to the network in accordance with the network/access configuration. The device can access the network only when it is in `GRANTED` state. If the state is `DENIED` it means that the API provider was not able to grant the access or the grant had to be revoked.

    If callback related information is provided, it will be used to notify of state transitions for all devices included in the access.

    ## Error handling:

    - If the dedicated network identified by the networkId is in an incompatible state when creating a network access, e.g. it is in the TERMINATED state, then the server will return an error with the `409 INCOMPATIBLE_STATE` error code.
    - If not all requested devices could be added, the API returns `results` with an error result for each failed device detailing why it failed.
      - If a devices cannot be added because the `maxNumberOfDevices` is already reached, the device status will be returned with `429 QUOTA_EXCEEDED` error code.

    # Adding devices to an access

    When an access already exists, additional devices can be added by performing a `POST` operation on the `/accesses/{accessId}/devices/add` endpoint.

    The API Consumer provides the following information

    - a list of identifiers of the devices to be added, using a device object as device identifier

    If all the requested devices could be added, the API returns a list with information for each requested device.

    ## Error handling:

    - If not all requested devices could be added, the API returns a result detailing which devices were added and which failed.
      - If a devices cannot be added because the `maxNumberOfDevices` is already reached, the device status will be returned with `429 QUOTA_EXCEEDED` error code.

    If callback related information was provided for the access, it will be used to also notify of state transitions for all the newly included devices.

    # Removing devices from an access

    When an access already exists, devices can be removed from it by performing a `POST` operation on the `/accesses/{accessId}/devices/remove` endpoint.

    The API Consumer provides the following information

    - a list of identifiers of the devices to be removed, using a device object as device identifier

    The API returns a confirmation of removal or, if not all devices could be removed, a result detailing which devices were removed and which failed.

    # Querying devices in an access

    All devices included in an access can be queried by performing a `GET` operation on the `/accesses/{accessId}/devices` collection endpoint. The query can be for a specific device or for devices with a specific status.

    # Querying one or more accesses

    All available accesses of the API consumer can be queried by performing a `GET` operation on the `/accesses` endpoint. The query can be filtered for accesses to a specific network or those including a specific device.

    A specific access of the API consumer can be queried by performing a `GET` operation on the `/accesses/{accessId}` endpoint, where the accessId has been obtained during the _create_ procedure.

    # Deleting an access

    A specific access of the API consumer can be deleted by performing a `DELETE` operation on the `/accesses/{accessId}` endpoint. Deletion of the access can be interpreted as removal of the permission for all the devices included in the access to access the network.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->
    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.2.0-rc.1
  x-camara-commonalities: 0.8.0
servers:
  - url: '{apiRoot}/dedicated-network-accesses/v0.2rc1'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Accesses
    description: Manage accesses to a dedicated network for devices
  - name: Devices
    description: Manage devices of an access to a dedicated network
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/DedicatedNetworks
paths:
  /accesses:
    get:
      tags:
        - Accesses
      summary: Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or for a given dedicated network
      description: |
        Get a paged list of accesses to dedicated networks, optionally filtered for a given device and/or for a given dedicated network
      operationId: listAccesses
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of accesses to return per page
          schema:
            $ref: '#/components/schemas/PerPage'
        - name: page
          in: query
          description: |
            Number of the page of accesses to return
          schema:
            $ref: '#/components/schemas/Page'
        - name: networkId
          in: query
          description: Dedicated network id
          schema:
            $ref: '#/components/schemas/NetworkId'
        - $ref: '#/components/parameters/x-device'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: A list of existing accesses to dedicated networks matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            X-Total-Count:
              $ref: '#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '#/components/headers/x-total-pages'
            Link:
              $ref: '#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInfosPage'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
    post:
      tags:
        - Accesses
      summary: Create an access to a dedicated network with given configuration, optionally including devices
      description: |
        Create an access to a dedicated network with given configuration, optionally including devices
      operationId: createAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:create
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
      callbacks:
        notifications:
          '{$request.body#/sink}':
            post:
              tags:
                - Device access status callback
              summary: Device access status notifications callback
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                It will be called upon change of the network access request status.
                Currently only DEVICE_STATUS_CHANGED event is defined.
              operationId: postNotification
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/AccessDeviceNotificationEvent'
                    examples:
                      DEVICE_STATUS_CHANGED_EXAMPLE:
                        $ref: '#/components/examples/DEVICE_STATUS_CHANGED_EXAMPLE'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/Generic400'
                '401':
                  $ref: '#/components/responses/Generic401'
                '403':
                  $ref: '#/components/responses/Generic403'
                '410':
                  $ref: '#/components/responses/Generic410'
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        '201':
          description: Successful creation of the access for all devices (if any)
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: URL including the resource identifier of the newly created network access.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessSuccess'
        '207':
          description: Successful creation of the access for some devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: URL including the resource identifier of the newly created network access.
              required: true
              schema:
                type: string
                format: uri
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessPartialSuccess'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '409':
          $ref: '#/components/responses/Generic409'
        '422':
          $ref: '#/components/responses/Generic422'
  /accesses/{accessId}:
    get:
      tags:
        - Accesses
      summary: Read access information
      description: |
        Read access information
      operationId: readAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:read
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AccessId'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: Access information
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedAccessInfo'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
    delete:
      tags:
        - Accesses
      summary: Delete an access
      description: |
        Delete an access
      operationId: deleteAccess
      security:
        - openId:
            - dedicated-network-accesses:accesses:delete
      parameters:
        - name: accessId
          description: access identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AccessId'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '204':
          description: Successful deletion of the access
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
  /accesses/{accessId}/devices:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
    get:
      tags:
        - Devices
      summary: Read a paged list of devices with information included in the access, optionally filtered for a given device and/or for a given device status
      description: |
        Read a paged list of devices with information included in the access, optionally filtered for a given device and/or for a given device status
      operationId: listDevices
      security:
        - openId:
            - dedicated-network-accesses:devices:read
      parameters:
        - name: perPage
          in: query
          description: |
            Number of access devices to return per page
          schema:
            $ref: '#/components/schemas/PerPage'
        - name: page
          in: query
          description: |
            Number of the page of access devices to return
          schema:
            $ref: '#/components/schemas/Page'
        - name: deviceStatus
          in: query
          description: Only access devices with this status are to be returned
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - $ref: '#/components/parameters/x-device'
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: A list of devices matching the given criteria and in the requested page (can be empty).
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            X-Total-Count:
              $ref: '#/components/headers/x-total-count'
            X-Total-Pages:
              $ref: '#/components/headers/x-total-pages'
            Link:
              $ref: '#/components/headers/link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDevicesPage'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
  /accesses/{accessId}/devices/add:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
      - $ref: '#/components/parameters/x-correlator'
    post:
      tags:
        - Devices
      summary: Add devices to the access
      description: |
        Add devices to the access
      operationId: addDevicesToAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDevicesRequest'
      responses:
        '201':
          description: Successful addition of all the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDevicesSuccess'
        '207':
          description: Partially successful addition of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDevicesPartialSuccess'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '409':
          $ref: '#/components/responses/Generic409'
        '422':
          $ref: '#/components/responses/NoProcessableDevices422'
  /accesses/{accessId}/devices/remove:
    parameters:
      - name: accessId
        description: access identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccessId'
      - $ref: '#/components/parameters/x-correlator'
    post:
      tags:
        - Devices
      summary: Remove devices from the access
      description: Remove devices from the access
      operationId: removeDevicesFromAccess
      security:
        - openId:
            - dedicated-network-accesses:devices:remove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDevicesRequest'
      responses:
        '204':
          description: Successful removal of all the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '207':
          description: Partially successful removal of devices, success for at least one of the given devices
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveDevicesPartialSuccess'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '409':
          $ref: '#/components/responses/Generic409'
        '422':
          $ref: '#/components/responses/NoProcessableDevices422'
components:
  securitySchemes:
    openId:
      description: OpenID Connect authentication
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    notificationsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '{$request.body#/sinkCredential.credentialType}'
      description: |
        Bearer token for notification delivery. Token format is determined
        by `sinkCredential.credentialType` in the subscription request.
  parameters:
    x-device:
      name: x-device
      in: header
      description: Device object represented in a header
      schema:
        $ref: '#/components/schemas/SerializedDevice'
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  schemas:
    AccessId:
      description: Network access id in UUID format
      type: string
      format: uuid
      maxLength: 36
    NetworkId:
      description: Network id in UUID format
      type: string
      format: uuid
      maxLength: 36
    DeviceStatus:
      description: |
        The current status of the device in the context of the access. The status can be one of the following:
        * `REQUESTED` - The device was requested to have access to the network. Possible transitions to GRANTED and DENIED states.
        * `GRANTED` - The device was granted access to the network by the CSP, and therefore the device can use the Dedicated Network when the network is in the ACTIVATED state. Possible transition to DENIED state.
        * `DENIED` - The device was denied access to the network by the CSP, and therefore the device can not use the Dedicated Network. The denial can be caused by a variety of conditions, such as lack of resources or system failure.
      type: string
      enum:
        - REQUESTED
        - GRANTED
        - DENIED
    ReasonInfo:
      description: |
        Information about the reason for a change
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the reason
        message:
          type: string
          maxLength: 4096
          description: A human-readable description of what the reason represents
    DeviceStatusInfo:
      description: Additional information about the reason for the current device status
      type: object
      properties:
        reason:
          description: |
            Information about the reason for a device status change in the context of the access
          allOf:
            - $ref: '#/components/schemas/ReasonInfo'
            - type: object
              properties:
                code:
                  enum:
                    - REQUEST_APPROVED
                    - REQUEST_REJECTED
                    - REQUEST_FAILED
                    - ACCESS_REVOKED
                    - ACCESS_FAILED
    AccessDevicesPage:
      description: A page of access devices
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          $ref: '#/components/schemas/AccessDevices'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AccessDevices:
      description: A list of access devices
      type: array
      minItems: 0
      maxItems: 9007199254740991
      items:
        $ref: '#/components/schemas/AccessDevice'
    RecentAccessDevices:
      description: |
        Information about devices requested and accepted to be added to the access in the most recent `createAccess` or `addDevicesToAccess` operation.
        These are the devices that were accepted for further processing, i.e. not immediately rejected due to an error condition and not removed by a more recent remove operation.
      type: object
      properties:
        recentAccessDevices:
          description: |
            A list of devices requested to be added to the access within either the `createAccess` operation or with the latest `addDevicesToAccess` operation, accepted for further processing, i.e. not immediately rejected due to an error condition and not removed by a more recent remove operation.
            **NOTE:** the list is limited to a maximum of 100 devices and may therefore not be a complete list of access devices within an access.
          allOf:
            - $ref: '#/components/schemas/AccessDevices'
            - minItems: 1
            - maxItems: 100
    AccessDevice:
      description: Information about a single device included in an access
      type: object
      properties:
        device:
          $ref: '#/components/schemas/ValidDevice'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        statusInfo:
          $ref: '#/components/schemas/DeviceStatusInfo'
      required:
        - device
        - status
    BaseAccessInfo:
      description: Common attributes of an access to a dedicated network
      type: object
      properties:
        networkId:
          $ref: '#/components/schemas/NetworkId'
        qosProfiles:
          description: (Optional) List of supported QOS profiles usable for the device(s). When absent, all QosProfiles of the network are supported. Only a subset of the QOS profiles of the network is allowed
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/QosProfileName'
        defaultQosProfile:
          $ref: '#/components/schemas/QosProfileName'
        sink:
          description: The address to which events shall be delivered using the selected protocol.
          type: string
          format: uri
          pattern: ^https:\/\/.+$
          maxLength: 2048
        sinkCredential:
          $ref: '#/components/schemas/SinkCredential'
      required:
        - networkId
    CreateAccessRequest:
      description: Attributes required to create a dedicated network access for devices
      allOf:
        - $ref: '#/components/schemas/BaseAccessInfo'
        - type: object
          properties:
            devices:
              allOf:
                - $ref: '#/components/schemas/Devices'
                - minItems: 1
                - maxItems: 100
    CreateAccessSuccess:
      description: |
        Response body used when access was created successfully.
        If the request contained devices (to be added to the access) this response also implies that they were all added successfully and are listed in `recentAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/ExtendedAccessInfo'
    CreateAccessPartialSuccess:
      description: |
        Response body used when access was created successfully but for some devices only.
        Devices added successfully (if any) are returned in `recentAccessDevices` while failed devices are listed in `results`.
        Absence of `recentAccessDevices` means that no device was added successfully.
      allOf:
        - $ref: '#/components/schemas/ExtendedAccessInfo'
        - $ref: '#/components/schemas/ErrorResultsForDevices'
        - required:
            - results
    AccessStats:
      description: Statistical information for a dedicated network access
      type: object
      properties:
        totalDevices:
          description: the total number of devices included in the access (regardless of status)
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        totalGranted:
          description: the total number of devices included in the access with status GRANTED
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        totalDenied:
          description: the total number of devices included in the access with status DENIED
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      required:
        - totalDevices
        - totalGranted
        - totalDenied
    AccessInfo:
      description: |
        Information about a dedicated network access which includes the following:
        * id - a unique identifier of the access
        * networkId - network identifier
        * qosProfiles - optionally, a list of QoS profiles relevant for this access, which must be a subset of the QoS profiles already defined for the network.
        * defaultQosProfile - optionally, a default QoS profile for all the devices granted access to this access. This QoS profile must be selected from the QoS profiles defined for this access.
        * stats - access statistics.
        * sink and sinkCredential - optionally, callback information for event notifications pertaining to this access.
      allOf:
        - $ref: '#/components/schemas/BaseAccessInfo'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/AccessId'
            stats:
              $ref: '#/components/schemas/AccessStats'
          required:
            - id
            - stats
    ExtendedAccessInfo:
      description: |
        Information about a dedicated network access extended with the following information:
        * recentAccessDevices - optionally, a list of access devices recently added to the access in the `createAccess` or `addDevicesToAccess` operation (if any).
      allOf:
        - $ref: '#/components/schemas/AccessInfo'
        - $ref: '#/components/schemas/RecentAccessDevices'
    AccessInfosPage:
      description: A page of accesses with information
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: A list of accesses with information
          items:
            $ref: '#/components/schemas/AccessInfo'
          maxItems: 100
        pagination:
          $ref: '#/components/schemas/Pagination'
    AddDevicesRequest:
      description: Request body used to add devices to an access
      type: object
      required:
        - devices
      properties:
        devices:
          description: List of devices to be added to the access
          allOf:
            - $ref: '#/components/schemas/Devices'
            - minItems: 1
            - maxItems: 100
    AddDevicesSuccess:
      description: |
        Response body used when all devices could be added to an access successfully and are listed in `recentAccessDevices`.
      allOf:
        - $ref: '#/components/schemas/RecentAccessDevices'
        - required:
            - recentAccessDevices
    AddDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be added successfully.
        Devices added successfully are returned in `recentAccessDevices` while failed devices are listed in `results`.
      allOf:
        - $ref: '#/components/schemas/RecentAccessDevices'
        - $ref: '#/components/schemas/ErrorResultsForDevices'
        - required:
            - recentAccessDevices
            - results
    RemoveDevicesRequest:
      description: Request body used to remove devices from an access
      type: object
      required:
        - devices
      properties:
        devices:
          description: List of devices to be removed from the access
          allOf:
            - $ref: '#/components/schemas/Devices'
            - minItems: 1
            - maxItems: 100
    RemoveDevicesPartialSuccess:
      description: |
        Response body used when not all devices could be removed successfully.
        It contains a list of error results, one result per failed device, detailing the result of the failed attempt to remove the device from the access.
        Devices which were successfully removed are not listed.
      allOf:
        - $ref: '#/components/schemas/ErrorResultsForDevices'
        - required:
            - results
    ErrorResults:
      description: |
        Response body used when none of the devices could be processed successfully.
        It contains the overall error information and a list of error results, one result per device.
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - $ref: '#/components/schemas/ErrorResultsForDevices'
        - required:
            - results
    ErrorResultsForDevices:
      description: An object describing error results of an operation targeting multiple devices
      type: object
      properties:
        results:
          description: A list of operation error results, one result per device
          type: array
          items:
            $ref: '#/components/schemas/ErrorResultForDevice'
          minItems: 1
          maxItems: 100
    ErrorResultForDevice:
      description: Information about the error pertaining to an operation for a device
      oneOf:
        - $ref: '#/components/schemas/DeviceValidationError'
        - $ref: '#/components/schemas/DeviceNotFoundError'
        - $ref: '#/components/schemas/DeviceConflictError'
        - $ref: '#/components/schemas/DeviceUnprocessableError'
        - $ref: '#/components/schemas/DeviceMaxExceededError'
    DeviceValidationError:
      description: Error when device failed validation
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/InvalidDevice'
            status:
              enum:
                - 400
            code:
              enum:
                - INVALID_ARGUMENT
                - OUT_OF_RANGE
    DeviceNotFoundError:
      description: Error when device is not found
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/ValidDevice'
            status:
              enum:
                - 404
            code:
              enum:
                - NOT_FOUND
                - IDENTIFIER_NOT_FOUND
    DeviceConflictError:
      description: Error when device is in conflict with another resource
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/ValidDevice'
            status:
              enum:
                - 409
            code:
              enum:
                - ABORTED
                - ALREADY_EXISTS
                - INCOMPATIBLE_STATE
    DeviceUnprocessableError:
      description: Error when device can not be processed
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/ValidDevice'
            status:
              enum:
                - 422
            code:
              enum:
                - SERVICE_NOT_APPLICABLE
                - MISSING_IDENTIFIER
                - UNSUPPORTED_IDENTIFIER
                - UNNECESSARY_IDENTIFIER
    DeviceMaxExceededError:
      description: Error when device exceeds maximum number of allowed devices
      allOf:
        - $ref: '#/components/schemas/ErrorInfo'
        - type: object
          properties:
            device:
              $ref: '#/components/schemas/ValidDevice'
            status:
              enum:
                - 429
            code:
              enum:
                - QUOTA_EXCEEDED
    AccessDeviceEventType:
      description: Enum of event types for the Dedicated Network Accesses API.
      type: string
      enum:
        - org.camaraproject.dedicated-network-accesses.v0.device-status-changed
    AccessDeviceNotificationEvent:
      description: Notification event for device access status changes. Constrains the CloudEvent `type` to access-specific event types.
      allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/AccessDeviceEventType'
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.dedicated-network-accesses.v0.device-status-changed: '#/components/schemas/EventDeviceStatusChanged'
    EventDeviceStatusChanged:
      description: Event to notify a status change of one or more devices in the context of an access to a dedicated network
      allOf:
        - $ref: '#/components/schemas/AccessDeviceNotificationEvent'
        - type: object
          properties:
            data:
              type: object
              description: Status change details for one or more devices in the context of an access to a dedicated network
              required:
                - accessId
                - accessDevices
              properties:
                accessId:
                  $ref: '#/components/schemas/AccessId'
                accessDevices:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccessDevice'
                  minItems: 1
                  maxItems: 100
          required:
            - data
    ValidDevice:
      description: |
        A device is identified by the CAMARA `device` object. Out of the four identifiers defined by the `device` object, this API supports the Phone Number assigned by the mobile network operator as the only option.
        NOTE1: Phone Number is the required identifier in a `device` object for this API. Any other identifier present in a `device` object received by this API will be silently ignored but will be retained and echoed back.
        NOTE2: A `device` object without a Phone Number will be rejected by this API.
      allOf:
        - $ref: '#/components/schemas/Device'
        - required:
            - phoneNumber
    Devices:
      description: A list of devices
      type: array
      maxItems: 9007199254740991
      items:
        $ref: '#/components/schemas/ValidDevice'
    SerializedDevice:
      description: |
        Device object serialized to a string for use as a device identifier.
        It is serialized according to RFC 8941 as a structured field value where
        the Device object is a dictionary, with the following additonal provisions
          - property names are changed to lower case to comply with the RFC and are ordered alphabetically
          - serializing property values must comply with the RFC depending on the type, and in particular
            - if the property value is a string which contains only ASCII characters, the string can be serialized as String,
              as per section 3.3.3 of the RFC
            - if the property value is a string and contains non-ASCII characters, the string must be serialized as Byte Sequence using UTF-8 encoding,
              as per section 3.3.5 of the RFC
      type: string
      maxLength: 4096
      example: phonenumber="+123456789"
    InvalidDevice:
      description: |
        This object is defined to be able to return any invalid device object to the API invoker.
      type: object
      additionalProperties: true
    QosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an operator is offering can be retrieved by means of the QoS Profile API.
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: ^[a-zA-Z0-9_.-]+$
    PerPage:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 20
      description: Number of items per page.
      example: 20
    Page:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      default: 1
      description: Current page number (1-indexed).
      example: 1
    XCorrelator:
      type: string
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    TotalCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Total number of items matching the query, after filters applied. MAY be omitted where a full count query is prohibitively expensive.
      example: 87
    TotalPages:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Total number of pages. Equals ceil(totalCount / perPage). MAY be omitted where totalCount is omitted.
      example: 5
    SinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: '#/components/schemas/AccessTokenCredential'
          PRIVATE_KEY_JWT: '#/components/schemas/PrivateKeyJWTCredential'
      required:
        - credentialType
    AccessTokenCredential:
      type: object
      description: An access token credential. This type of credential is meant to be used by API Consumers that have limited capabilities to handle authorization requests.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a token granting access to the target resource.
              type: string
              maxLength: 4096
              writeOnly: true
            accessTokenExpiresUtc:
              type: string
              format: date-time
              maxLength: 64
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: '2023-07-03T12:27:08.312Z'
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              writeOnly: true
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    PrivateKeyJWTCredential:
      type: object
      description: Use PRIVATE_KEY_JWT to get an access token. This type of credential is to be used by clients that have an authorization server.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            clientId:
              description: The client ID used to authenticate when requesting an access token using PRIVATE_KEY_JWT.
              type: string
              maxLength: 128
              writeOnly: true
            tokenUri:
              description: The URI where to request an access token using PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              writeOnly: true
            jwksUri:
              description: The URI used to request the public key to verify that the JWT assertion was signed by PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              readOnly: true
    Pagination:
      description: Pagination details helping to navigate through paged results efficiently.
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        perPage:
          $ref: '#/components/schemas/PerPage'
        totalCount:
          $ref: '#/components/schemas/TotalCount'
        totalPages:
          $ref: '#/components/schemas/TotalPages'
    ErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
    PhoneNumber:
      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: ^\+[1-9][0-9]{4,14}$
      maxLength: 16
      example: '+123456789'
    NetworkAccessIdentifier:
      description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
      type: string
      maxLength: 2048
      example: 123456789@example.com
    SingleIpv4Address:
      description: A single IPv4 address with no subnet mask
      type: string
      format: ipv4
      maxLength: 15
      example: 84.125.93.10
    Port:
      description: TCP or UDP port number
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
    DeviceIpv4Address:
      type: object
      description: |
        The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).

        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.

        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)

        In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.
      properties:
        publicAddress:
          $ref: '#/components/schemas/SingleIpv4Address'
        privateAddress:
          $ref: '#/components/schemas/SingleIpv4Address'
        publicPort:
          $ref: '#/components/schemas/Port'
      anyOf:
        - required:
            - publicAddress
            - privateAddress
        - required:
            - publicAddress
            - publicPort
      example:
        publicAddress: 84.125.93.10
        publicPort: 59765
    DeviceIpv6Address:
      description: |
        The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).
      type: string
      format: ipv6
      maxLength: 45
      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
    Device:
      description: |
        End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.
            The developer can choose to provide the below specified device identifiers:
            * `ipv4Address`
            * `ipv6Address`
            * `phoneNumber`
            * `networkAccessIdentifier`
            NOTE1: the network operator might support only a subset of these options. The API Consumer can provide multiple identifiers to ensure compatibility across different network operators. In this case, the API Provider will use one of the identifiers for the API logic without performing any matching checks among the provided identifiers.
            NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        networkAccessIdentifier:
          $ref: '#/components/schemas/NetworkAccessIdentifier'
        ipv4Address:
          $ref: '#/components/schemas/DeviceIpv4Address'
        ipv6Address:
          $ref: '#/components/schemas/DeviceIpv6Address'
      minProperties: 1
    Source:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      description: |
        Identifies the context in which an event happened - be a non-empty `URI-reference` like:
        - URI with a DNS authority:
          * https://github.com/cloudevents
          * mailto:cncf-wg-serverless@lists.cncf.io
        - Universally-unique URN with a UUID:
          * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
        - Application-specific identifier:
          * /cloudevents/spec/pull/123
          * 1-555-123-4567
      example: https://notificationSendServer12.example.com
    DateTime:
      type: string
      format: date-time
      maxLength: 64
      description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
      example: '2018-04-05T17:31:00Z'
    CloudEvent:
      type: object
      description: |
        CloudEvents 1.0 specification envelope.
        This schema is the stable base for all CAMARA event notifications.
        It imposes no constraints on `type` values or `data` structure —
        those concerns belong to the API-specific and lifecycle group schemas.
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          type: string
          maxLength: 256
          description: Identifier of this event, unique within the source context.
        source:
          $ref: '#/components/schemas/Source'
        type:
          type: string
          maxLength: 512
          description: |
            Identifies the event type. CAMARA APIs use reverse-DNS notation:
            `org.camaraproject.<api-name>.<event-version>.<event-name>`
            The api-name segment makes each type globally unique across API groups.
        specversion:
          type: string
          description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          enum:
            - '1.0'
        datacontenttype:
          type: string
          description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          enum:
            - application/json
        data:
          type: object
          description: Event details payload. Structure is defined by each concrete event schema.
        time:
          $ref: '#/components/schemas/DateTime'
  responses:
    Generic400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
            GENERIC_400_OUT_OF_RANGE:
              description: Out of Range. Specific Syntax Exception used when a given field has a pre-defined range or a invalid filter criteria combination is requested
              value:
                status: 400
                code: OUT_OF_RANGE
                message: Client specified an invalid range.
    Generic401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              description: Request cannot be authenticated and a new authentication is required
              value:
                status: 401
                code: UNAUTHENTICATED
                message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication is required.
    Generic403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - INVALID_TOKEN_CONTEXT
          examples:
            GENERIC_403_PERMISSION_DENIED:
              description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
              value:
                status: 403
                code: PERMISSION_DENIED
                message: Client does not have sufficient permissions to perform this action.
            GENERIC_403_INVALID_TOKEN_CONTEXT:
              description: Reflect some inconsistency between information in some field of the API and the related OAuth2 Token
              value:
                status: 403
                code: INVALID_TOKEN_CONTEXT
                message: '{{field}} is not consistent with access token.'
    Generic404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              description: Resource is not found
              value:
                status: 404
                code: NOT_FOUND
                message: The specified resource is not found.
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              description: Some identifier cannot be matched to a device
              value:
                status: 404
                code: IDENTIFIER_NOT_FOUND
                message: Device identifier not found.
    Generic409:
      description: Conflict
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ABORTED
                      - ALREADY_EXISTS
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_ABORTED:
              description: Concurrency of processes of the same nature/scope
              value:
                status: 409
                code: ABORTED
                message: Concurrency conflict.
            GENERIC_409_ALREADY_EXISTS:
              description: Trying to create an existing resource
              value:
                status: 409
                code: ALREADY_EXISTS
                message: The resource that a client tried to create already exists.
            GENERIC_409_INCOMPATIBLE_STATE:
              description: A resource referenced in the request is in an incompatible state for the requested operation
              value:
                status: 409
                code: INCOMPATIBLE_STATE
                message: A referenced resource is in an incompatible state.
    Generic410:
      description: Gone
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 410
                  code:
                    enum:
                      - GONE
          examples:
            GENERIC_410_GONE:
              description: Use in notifications flow to allow API Consumer to indicate that its callback is no longer available
              value:
                status: 410
                code: GONE
